<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Campaign — Brackenroll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .join-wrap {
            max-width: 480px;
            margin: 0 auto;
            padding: 80px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
        }
        .join-logo {
            font-family: 'Cinzel', serif;
            font-size: 0.72em;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--ink-dim);
            text-decoration: none;
        }
        .join-logo:hover { color: var(--gold); }
        .join-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8em;
            font-weight: 700;
            color: var(--h-gold-b);
            letter-spacing: 0.04em;
        }
        .join-body {
            color: var(--ink-muted);
            font-style: italic;
            line-height: 1.6;
        }
        .join-code {
            font-family: 'Cinzel', serif;
            font-size: 1.4em;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 0.3em;
            background: rgba(201,168,76,0.07);
            border: 1px solid rgba(201,168,76,0.2);
            padding: 10px 28px;
        }
        .join-status {
            font-family: 'Cinzel', serif;
            font-size: 0.78em;
            letter-spacing: 0.1em;
            color: var(--ink-dim);
        }
        .join-status.error { color: #c04040; }
    </style>
</head>
<body>
    <div class="join-wrap">
        <a href="index.html" class="join-logo">Brackenroll</a>
        <div class="join-title">You've Been Invited</div>
        <div class="join-body" id="joinBody">You've been invited to join a campaign.</div>
        <div class="join-code" id="joinCode"></div>
        <div class="join-status" id="joinStatus">Sign in to join.</div>
        <a href="#" class="btn-sp btn-sp-primary" id="signinLink" style="display:none;">Sign In</a>
    </div>

    <script type="module">
        import { onAuthChange, joinCampaignByCode } from './supabase-client.js';

        const params = new URLSearchParams(window.location.search);
        const code   = params.get('code')?.toUpperCase() ?? '';

        const codeEl    = document.getElementById('joinCode');
        const statusEl  = document.getElementById('joinStatus');
        const signinLink = document.getElementById('signinLink');

        if (!code) {
            window.location.href = 'index.html';
        }

        codeEl.textContent = code;

        // Point sign-in link back to this join page after auth
        signinLink.href = `signin.html?redirect=${encodeURIComponent('join.html?code=' + code)}`;

        onAuthChange(async user => {
            if (!user) {
                signinLink.style.display = '';
                statusEl.textContent = 'Sign in to join this campaign.';
                return;
            }

            signinLink.style.display = 'none';
            statusEl.textContent = 'Joining campaign…';
            statusEl.className = 'join-status';

            try {
                const campaignId = await joinCampaignByCode(user.uid, code);
                statusEl.textContent = 'Joined! Redirecting…';
                window.location.href = `campaign.html?id=${campaignId}`;
            } catch (e) {
                statusEl.textContent = 'Campaign not found. Check your invite link and try again.';
                statusEl.className = 'join-status error';
            }
        });
    </script>
</body>
</html>
