<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The World — Brackenroll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ── Tab bar ── */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border-gold);
            margin-bottom: 36px;
            overflow-x: auto;
        }
        .tab-btn {
            font-family: 'Cinzel', serif;
            font-size: 0.75em;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--ink-dim);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 12px 28px;
            cursor: pointer;
            margin-bottom: -1px;
            transition: color 0.2s, border-color 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-btn:hover { color: var(--gold); }
        .tab-btn.active { color: var(--gold-mid); border-bottom-color: var(--gold); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── Block: heading ── */
        .cp-heading {
            font-family: 'Cinzel', serif;
            font-size: 1.3em;
            font-weight: 600;
            color: var(--gold-mid);
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 10px;
            margin: 36px 0 20px;
        }
        .cp-heading:first-child { margin-top: 0; }

        /* ── Block: prose ── */
        .cp-prose { max-width: 720px; margin: 0 0 24px; }
        .cp-prose p { color: var(--ink-muted); font-size: 1.05em; margin-bottom: 14px; line-height: 1.75; }
        .cp-prose p:last-child { margin-bottom: 0; }
        .cp-prose strong { color: var(--ink); }

        /* ── Block: callout ── */
        .cp-callout {
            padding: 28px 32px;
            margin: 0 0 24px;
            max-width: 720px;
        }
        .cp-callout h3 {
            font-family: 'Cinzel', serif;
            font-size: 1em;
            color: var(--gold-mid);
            margin: 0 0 12px;
        }
        .cp-callout p { color: var(--ink-muted); margin-bottom: 10px; font-size: 1em; line-height: 1.7; }
        .cp-callout p:last-child { margin-bottom: 0; }
        .cp-callout-info {
            background: rgba(248, 242, 228, 0.6);
            border: 1px solid rgba(120, 80, 30, 0.2);
            position: relative;
        }
        .cp-callout-info::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(138,92,16,0.3), transparent);
        }
        .cp-callout-warning {
            background: rgba(30, 16, 8, 0.06);
            border: 1px solid var(--border-gold);
            text-align: center;
        }
        .cp-callout-warning h3 { color: var(--gold); }
        .cp-callout-quote {
            border-left: 3px solid var(--border-gold);
            background: transparent;
            padding-left: 24px;
        }
        .cp-callout-quote p { font-style: italic; }
        .cp-callout-flavor {
            background: transparent;
            padding: 0 0 0 16px;
            border-left: 2px solid var(--border-mid);
        }
        .cp-callout-flavor p { font-style: italic; color: var(--ink-dim); font-size: 0.95em; }

        /* ── Block: list ── */
        .cp-list {
            list-style: none;
            padding: 0;
            margin: 0 0 24px;
            max-width: 680px;
        }
        .cp-list li {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            color: var(--ink-muted);
            font-size: 1em;
            line-height: 1.6;
        }
        .cp-list li:last-child { border-bottom: none; }
        .cp-list li::before { content: '—'; color: var(--ink-dim); flex-shrink: 0; margin-top: 2px; }

        /* ── Block: card grid ── */
        .cp-card-grid {
            display: grid;
            gap: 14px;
            margin: 0 0 24px;
        }
        .cp-card-grid-2 { grid-template-columns: 1fr 1fr; }
        .cp-card-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
        .cp-card {
            background: rgba(248, 242, 228, 0.55);
            border: 1px solid var(--border);
            border-top-width: 3px;
            padding: 20px 22px;
            position: relative;
        }
        .cp-card-badge {
            font-family: 'Cinzel', serif;
            font-size: 0.6em;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-dim);
            margin-bottom: 6px;
        }
        .cp-card-title {
            font-family: 'Cinzel', serif;
            font-size: 1em;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 10px;
        }
        .cp-card-body {
            font-size: 0.9em;
            color: var(--ink-muted);
            line-height: 1.6;
        }

        /* ── Block: image ── */
        .cp-image {
            margin: 0 0 24px;
            max-width: 720px;
        }
        .cp-image img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid var(--border);
        }
        .cp-image figcaption {
            font-size: 0.86em;
            color: var(--ink-dim);
            font-style: italic;
            margin-top: 8px;
            text-align: center;
        }

        /* ── GM edit link ── */
        .cp-gm-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .cp-edit-link {
            font-family: 'Cinzel', serif;
            font-size: 0.65em;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-dim);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 6px 14px;
            transition: all 0.2s;
        }
        .cp-edit-link:hover { color: var(--gold); border-color: var(--border-gold); }

        /* ── States ── */
        .cp-empty {
            text-align: center;
            padding: 80px 0;
        }
        .cp-empty-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2em;
            color: var(--gold-mid);
            margin-bottom: 12px;
        }
        .cp-empty-text {
            color: var(--ink-dim);
            font-style: italic;
            margin-bottom: 24px;
        }
        .cp-empty-link {
            font-family: 'Cinzel', serif;
            font-size: 0.72em;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold);
            text-decoration: none;
            border: 1px solid rgba(201,168,76,0.4);
            padding: 10px 22px;
            transition: all 0.2s;
            display: inline-block;
        }
        .cp-empty-link:hover { background: rgba(201,168,76,0.08); border-color: var(--gold); }

        .cp-error {
            max-width: 500px;
            margin: 80px auto;
            text-align: center;
            color: var(--ink-dim);
            font-style: italic;
        }
        .cp-error a {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 0.8em;
            letter-spacing: 0.1em;
            display: block;
            margin-top: 16px;
        }

        @media (max-width: 760px) {
            .cp-card-grid-2,
            .cp-card-grid-3 { grid-template-columns: 1fr; }
            .cp-callout { padding: 20px 18px; }
        }
    </style>
</head>
<body>

    <nav class="site-nav"></nav>

    <div id="heroWrap" style="display:none;">
        <div class="page-hero">
            <div class="page-hero-inner">
                <div class="page-hero-tag" id="heroTag">Campaign Resources</div>
                <h1 id="heroTitle">The World</h1>
                <p class="subtitle" id="heroSubtitle"></p>
            </div>
        </div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
        <div class="cp-gm-bar" id="gmBar" style="display:none;">
            <a id="editPagesLink" href="#" class="cp-edit-link">Edit Pages →</a>
        </div>
        <div class="tab-bar" id="tabBar"></div>
        <div id="tabPanels"></div>
    </div>

    <div class="container" id="emptyWrap" style="display:none;">
        <div class="cp-empty">
            <div class="cp-empty-title">No World Content Yet</div>
            <p class="cp-empty-text" id="emptyText">The GM hasn't published any world content for this campaign yet.</p>
            <a id="emptyEditLink" href="#" class="cp-empty-link" style="display:none;">Author World Pages →</a>
        </div>
    </div>

    <div class="container" id="errorWrap" style="display:none;">
        <div class="cp-error">
            <p id="errorText">Campaign not found or you don't have access.</p>
            <a href="index.html">← Back to Campaigns</a>
        </div>
    </div>

    <script type="module">
        import {
            onAuthChange,
            getCampaign,
            getCampaignMembers,
            getCampaignPages
        } from './supabase-client.js';

        const params     = new URLSearchParams(window.location.search);
        const campaignId = params.get('campaign');

        if (!campaignId) {
            window.location.href = 'index.html';
        }

        let currentUser = null;
        let isGM = false;

        onAuthChange(async user => {
            if (!user) {
                window.location.href = `signin.html?redirect=${encodeURIComponent(window.location.href)}`;
                return;
            }
            currentUser = user;
            await load();
        });

        async function load() {
            const [campaign, members, pages] = await Promise.all([
                getCampaign(campaignId),
                getCampaignMembers(campaignId),
                getCampaignPages(campaignId)
            ]);

            const isMember = members.some(m => m.uid === currentUser.uid);
            if (!campaign || !isMember) {
                showError('Campaign not found or you don\'t have access.');
                return;
            }

            isGM = campaign.gm_id === currentUser.uid;

            document.title = `The World — ${campaign.name}`;
            document.getElementById('heroSubtitle').textContent = campaign.name;
            document.getElementById('heroWrap').style.display = 'block';

            const editUrl = `page-editor.html?campaign=${campaignId}`;
            document.getElementById('editPagesLink').href = editUrl;

            if (pages.length === 0) {
                showEmpty(isGM, editUrl);
                return;
            }

            render(pages, isGM, editUrl);
        }

        function render(pages, isGM, editUrl) {
            if (isGM) {
                document.getElementById('gmBar').style.display = 'flex';
            }

            const tabBar    = document.getElementById('tabBar');
            const tabPanels = document.getElementById('tabPanels');
            tabBar.innerHTML    = '';
            tabPanels.innerHTML = '';

            pages.forEach((page, i) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
                btn.innerHTML = (page.icon ? `<span>${esc(page.icon)}</span>` : '') + esc(page.title);
                if (page.visibility === 'gm_only') {
                    btn.innerHTML += ' <span style="font-size:0.8em;opacity:0.5;" title="GM Only">🔒</span>';
                }
                btn.addEventListener('click', () => switchTab(i));
                tabBar.appendChild(btn);

                const panel = document.createElement('div');
                panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
                panel.innerHTML = renderBlocks(page.blocks || []);
                tabPanels.appendChild(panel);
            });

            document.getElementById('mainContent').style.display = 'block';
        }

        function switchTab(idx) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
        }

        function showEmpty(isGM, editUrl) {
            if (isGM) {
                document.getElementById('emptyText').textContent = 'No pages created yet. Use the editor to author world content for your players.';
                const link = document.getElementById('emptyEditLink');
                link.href = editUrl;
                link.style.display = 'inline-block';
            }
            document.getElementById('emptyWrap').style.display = 'block';
        }

        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorWrap').style.display = 'block';
        }

        // ── Block rendering ──────────────────────────────────────────────────

        function renderBlocks(blocks) {
            return blocks.map(renderBlock).join('');
        }

        function renderBlock(block) {
            if (!block?.type) return '';
            switch (block.type) {
                case 'heading':   return renderHeading(block.data || {});
                case 'prose':     return renderProse(block.data || {});
                case 'callout':   return renderCallout(block.data || {});
                case 'list':      return renderList(block.data || {});
                case 'card_grid': return renderCardGrid(block.data || {});
                case 'image':     return renderImage(block.data || {});
                default:          return '';
            }
        }

        function renderHeading(data) {
            return `<h2 class="cp-heading">${esc(data.text || '')}</h2>`;
        }

        function renderProse(data) {
            const paras = (data.text || '').split(/\n{2,}/).filter(Boolean);
            if (!paras.length) return '';
            const html = paras.map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
            return `<div class="cp-prose">${html}</div>`;
        }

        function renderCallout(data) {
            const style = ['info', 'warning', 'quote', 'flavor'].includes(data.style) ? data.style : 'info';
            const title = data.title ? `<h3>${esc(data.title)}</h3>` : '';
            const paras = (data.text || '').split(/\n{2,}/).filter(Boolean);
            const body  = paras.map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
            return `<div class="cp-callout cp-callout-${style}">${title}${body}</div>`;
        }

        function renderList(data) {
            const items = data.items || [];
            if (!items.length) return '';
            const html = items.map(item => `<li>${esc(item)}</li>`).join('');
            return `<ul class="cp-list">${html}</ul>`;
        }

        function renderCardGrid(data) {
            const cols  = data.cols === 3 ? 3 : 2;
            const cards = data.cards || [];
            if (!cards.length) return '';
            const cardsHtml = cards.map(card => {
                const accentStyle = card.accent ? ` style="border-top-color:${esc(card.accent)}"` : '';
                const badge = card.badge ? `<div class="cp-card-badge">${esc(card.badge)}</div>` : '';
                const body  = esc(card.body || '').replace(/\n/g, '<br>');
                return `<div class="cp-card"${accentStyle}>${badge}<div class="cp-card-title">${esc(card.title || '')}</div><div class="cp-card-body">${body}</div></div>`;
            }).join('');
            return `<div class="cp-card-grid cp-card-grid-${cols}">${cardsHtml}</div>`;
        }

        function renderImage(data) {
            if (!data.url) return '';
            const caption = data.caption ? `<figcaption>${esc(data.caption)}</figcaption>` : '';
            return `<figure class="cp-image"><img src="${esc(data.url)}" alt="${esc(data.alt || '')}"></figure>${caption}`;
        }

        function esc(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>

    <script type="module" src="nav.js"></script>
</body>
</html>
