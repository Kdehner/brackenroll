<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile — Brackenroll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 48px 56px 80px;
        }

        /* Section card */
        .profile-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 32px 36px;
            margin-bottom: 16px;
        }
        .profile-section-title {
            font-family: 'Cinzel', serif;
            font-size: 0.82em;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold-mid);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-mid);
        }

        /* Fields */
        .profile-field { margin-bottom: 20px; }
        .profile-field:last-of-type { margin-bottom: 0; }
        .profile-label {
            font-family: 'Cinzel', serif;
            font-size: 0.7em;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-dim);
            display: block;
            margin-bottom: 8px;
        }
        .profile-input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-mid);
            color: var(--ink);
            font-family: 'EB Garamond', serif;
            font-size: 1em;
            padding: 10px 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .profile-input:focus { border-color: var(--gold); }
        .profile-input:disabled {
            opacity: 0.45;
            cursor: default;
        }
        .profile-hint {
            font-size: 0.82em;
            color: var(--ink-dim);
            font-style: italic;
            margin-top: 6px;
        }

        /* Color swatches */
        .color-swatches {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .color-swatch {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            outline: none;
        }
        .color-swatch:hover { transform: scale(1.12); }
        .color-swatch.selected { border-color: #fff; transform: scale(1.12); }

        /* Avatar preview */
        .avatar-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .avatar-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 1.1em;
            font-weight: 700;
            color: rgba(0,0,0,0.6);
        }
        .avatar-name {
            font-family: 'Cinzel', serif;
            font-size: 0.9em;
            color: var(--ink-muted);
        }

        /* Save button */
        .btn-save {
            font-family: 'Cinzel', serif;
            font-size: 0.72em;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            background: var(--gold);
            color: #0c0a07;
            border: 1px solid var(--gold);
            padding: 11px 28px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 24px;
            transition: background 0.2s;
        }
        .btn-save:hover { background: var(--h-gold-b); }
        .btn-save:disabled { opacity: 0.5; cursor: default; }

        /* Status messages */
        .profile-success {
            font-size: 0.85em;
            color: #5a9e5a;
            margin-top: 12px;
            display: none;
        }
        .profile-error {
            font-size: 0.85em;
            color: #c04040;
            margin-top: 12px;
            display: none;
        }

        /* Dice theme picker */
        .dice-theme-row {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .dice-theme-group label.profile-label { margin-bottom: 8px; }
        .dice-theme-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .dice-theme-btn {
            font-family: 'Cinzel', serif;
            font-size: 0.62em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 6px 12px;
            border: 1px solid var(--border-mid);
            background: transparent;
            color: var(--ink-dim);
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
        }
        .dice-theme-btn:hover { border-color: var(--gold); color: var(--gold); }
        .dice-theme-btn.selected { border-color: var(--gold); background: rgba(201,168,76,0.12); color: var(--gold); }

        /* Pending shares */
        .share-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .share-row:last-of-type { border-bottom: none; padding-bottom: 0; }
        .share-row:first-of-type { padding-top: 0; }
        .share-row-info { flex: 1; min-width: 0; }
        .share-row-name {
            font-family: 'Cinzel', serif;
            font-size: 0.82em;
            color: var(--ink);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .share-row-meta {
            font-family: 'EB Garamond', serif;
            font-size: 0.82em;
            color: var(--ink-dim);
            font-style: italic;
        }
        .share-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .share-accept-btn, .share-decline-btn {
            font-family: 'Cinzel', serif;
            font-size: 0.6em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 5px 12px;
            cursor: pointer;
            border: 1px solid;
            background: transparent;
            transition: all 0.15s;
        }
        .share-accept-btn  { color: #5a9e5a; border-color: rgba(90,158,90,0.4); }
        .share-accept-btn:hover  { background: rgba(90,158,90,0.1); }
        .share-decline-btn { color: var(--ink-dim); border-color: var(--border-mid); }
        .share-decline-btn:hover { color: rgba(192,96,96,0.9); border-color: rgba(192,96,96,0.3); }
        .shares-empty {
            font-family: 'EB Garamond', serif;
            font-style: italic;
            color: var(--ink-dim);
            font-size: 0.9em;
        }

        @media (max-width: 700px) {
            .profile-wrap { padding: 28px 20px 60px; }
            .profile-section { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <nav class="site-nav"></nav>
    <script type="module" src="nav.js"></script>

    <div class="page-hero">
        <div class="page-hero-inner">
            <div class="page-hero-tag">Account</div>
            <h1>Edit Profile</h1>
            <p class="subtitle">Your identity at the table</p>
        </div>
    </div>

    <div class="profile-wrap">

        <!-- Profile section -->
        <div class="profile-section">
            <div class="profile-section-title">Profile</div>

            <!-- Avatar preview -->
            <div class="avatar-preview">
                <div class="avatar-circle" id="avatarCircle"></div>
                <span class="avatar-name" id="avatarName"></span>
            </div>

            <div class="profile-field">
                <label class="profile-label" for="displayNameInput">Display Name</label>
                <input class="profile-input" id="displayNameInput" type="text" maxlength="40" autocomplete="off" placeholder="How you appear to other players">
            </div>

            <div class="profile-field">
                <label class="profile-label">Avatar Color</label>
                <div class="color-swatches" id="colorSwatches"></div>
            </div>

            <button class="btn-save" id="saveProfileBtn">Save Changes</button>
            <p class="profile-success" id="profileSuccess">Profile updated.</p>
            <p class="profile-error" id="profileError"></p>
        </div>

        <!-- Dice theme section -->
        <div class="profile-section">
            <div class="profile-section-title">Your Dice</div>
            <div class="dice-theme-row">
                <div class="dice-theme-group">
                    <label class="profile-label">Standard Dice</label>
                    <div class="dice-theme-options" id="standardThemeOptions"></div>
                </div>
                <div class="dice-theme-group">
                    <label class="profile-label">Hope Die (d12)</label>
                    <div class="dice-theme-options" id="hopeThemeOptions"></div>
                </div>
                <div class="dice-theme-group">
                    <label class="profile-label">Fear Die (d12)</label>
                    <div class="dice-theme-options" id="fearThemeOptions"></div>
                </div>
            </div>
            <button class="btn-save" id="saveDiceBtn">Save Dice</button>
            <p class="profile-success" id="diceSuccess">Dice preferences saved.</p>
            <p class="profile-error" id="diceError"></p>
        </div>

        <!-- Password section (email users only) -->
        <div class="profile-section" id="passwordSection" style="display:none;">
            <div class="profile-section-title">Change Password</div>

            <div class="profile-field">
                <label class="profile-label" for="currentPassword">Current Password</label>
                <input class="profile-input" id="currentPassword" type="password" autocomplete="current-password" placeholder="••••••••">
            </div>
            <div class="profile-field">
                <label class="profile-label" for="newPassword">New Password</label>
                <input class="profile-input" id="newPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters">
            </div>
            <div class="profile-field">
                <label class="profile-label" for="confirmPassword">Confirm New Password</label>
                <input class="profile-input" id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat new password">
            </div>

            <button class="btn-save" id="savePasswordBtn">Update Password</button>
            <p class="profile-success" id="passwordSuccess">Password updated.</p>
            <p class="profile-error" id="passwordError"></p>
        </div>

        <!-- Account info -->
        <div class="profile-section">
            <div class="profile-section-title">Account</div>
            <div class="profile-field">
                <label class="profile-label">Email</label>
                <input class="profile-input" id="emailDisplay" type="text" disabled>
            </div>
            <div class="profile-field">
                <label class="profile-label">Sign-in Method</label>
                <input class="profile-input" id="providerDisplay" type="text" disabled>
            </div>
        </div>

        <!-- Pending shares -->
        <div class="profile-section" id="sharesSection" style="display:none;">
            <div class="profile-section-title">Pending Shares</div>
            <div id="sharesList"></div>
        </div>

    </div>

    <script type="module">
        import {
            onAuthChange, getUserProfile, updateUserProfile,
            isEmailUser, changePassword,
            getPendingShares, acceptShare, declineShare
        } from './supabase-client.js';

        const COLORS = [
            { hex: '#c0392b', name: 'Crimson'  },
            { hex: '#2980b9', name: 'Sapphire' },
            { hex: '#27ae60', name: 'Emerald'  },
            { hex: '#8e44ad', name: 'Amethyst' },
            { hex: '#d4ac0d', name: 'Gold'     },
            { hex: '#ca6f1e', name: 'Copper'   },
            { hex: '#717d7e', name: 'Steel'    },
            { hex: '#c0609a', name: 'Rose'     },
        ];

        const THEMES = [
            { id: 'smooth',        label: 'Smooth'     },
            { id: 'default',       label: 'Default'    },
            { id: 'rust',          label: 'Rust'       },
            { id: 'rock',          label: 'Rock'       },
            { id: 'wooden',        label: 'Wooden'     },
            { id: 'blueGreenMetal',label: 'Metal'      },
            { id: 'diceOfRolling', label: 'Rolling'    },
            { id: 'smooth-pip',    label: 'Pip'        },
        ];

        const DEFAULT_DICE_PREFS = { standard_theme: 'smooth', hope_theme: 'default', fear_theme: 'rust' };

        let currentUser = null;
        let selectedColor = '';
        let dicePrefs = { ...DEFAULT_DICE_PREFS };

        // ── Color swatches ────────────────────────────────────────────────────
        const swatchWrap = document.getElementById('colorSwatches');
        COLORS.forEach(c => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'color-swatch';
            btn.style.background = c.hex;
            btn.title = c.name;
            btn.addEventListener('click', () => {
                selectedColor = c.hex;
                swatchWrap.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                btn.classList.add('selected');
                updateAvatarPreview();
            });
            swatchWrap.appendChild(btn);
        });

        function updateAvatarPreview() {
            const name = document.getElementById('displayNameInput').value.trim();
            const initial = name ? name.charAt(0).toUpperCase() : '?';
            const circle = document.getElementById('avatarCircle');
            circle.style.background = selectedColor || 'var(--border-mid)';
            circle.textContent = initial;
            document.getElementById('avatarName').textContent = name || 'Display Name';
        }

        document.getElementById('displayNameInput').addEventListener('input', updateAvatarPreview);

        // ── Dice theme picker ─────────────────────────────────────────────────
        function buildThemePicker(containerId, prefKey) {
            const wrap = document.getElementById(containerId);
            THEMES.forEach(t => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'dice-theme-btn' + (dicePrefs[prefKey] === t.id ? ' selected' : '');
                btn.textContent = t.label;
                btn.dataset.theme = t.id;
                btn.addEventListener('click', () => {
                    dicePrefs = { ...dicePrefs, [prefKey]: t.id };
                    wrap.querySelectorAll('.dice-theme-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
                wrap.appendChild(btn);
            });
        }

        function loadDicePrefs(profile) {
            dicePrefs = { ...DEFAULT_DICE_PREFS, ...(profile?.dice_prefs || {}) };
            ['standardThemeOptions', 'hopeThemeOptions', 'fearThemeOptions'].forEach(id => {
                document.getElementById(id).innerHTML = '';
            });
            buildThemePicker('standardThemeOptions', 'standard_theme');
            buildThemePicker('hopeThemeOptions',     'hope_theme');
            buildThemePicker('fearThemeOptions',     'fear_theme');
        }

        document.getElementById('saveDiceBtn').addEventListener('click', async () => {
            const err = document.getElementById('diceError');
            const ok  = document.getElementById('diceSuccess');
            hide(err); hide(ok);
            const btn = document.getElementById('saveDiceBtn');
            btn.disabled = true; btn.textContent = 'Saving…';
            try {
                await updateUserProfile(currentUser.uid, { dice_prefs: dicePrefs });
                show(ok);
                setTimeout(() => hide(ok), 3000);
            } catch (e) {
                console.error('Dice prefs save error:', e);
                show(err, 'Failed to save. Please try again.');
            } finally {
                btn.disabled = false; btn.textContent = 'Save Dice';
            }
        });

        // ── Auth ──────────────────────────────────────────────────────────────
        onAuthChange(async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            currentUser = user;
            await loadProfile(user);
            await loadPendingShares();
        });

        async function loadPendingShares() {
            const shares = await getPendingShares(currentUser.uid);
            const section = document.getElementById('sharesSection');
            const list    = document.getElementById('sharesList');

            if (!shares.length) { section.style.display = 'none'; return; }

            section.style.display = 'block';
            list.innerHTML = '';

            const TYPE_LABELS = {
                weapon: 'Weapon', armor: 'Armor', loot_item: 'Loot Item',
                domain_card: 'Domain Card', ancestry: 'Ancestry', community: 'Community',
                class: 'Class', domain: 'Domain', adversary: 'Adversary',
            };

            shares.forEach(share => {
                const item = share.homebrew_content;
                const row  = document.createElement('div');
                row.className = 'share-row';
                row.innerHTML =
                    `<div class="share-row-info">` +
                        `<div class="share-row-name">${esc(item.name)}</div>` +
                        `<div class="share-row-meta">${TYPE_LABELS[item.content_type] || item.content_type}</div>` +
                    `</div>` +
                    `<div class="share-row-actions">` +
                        `<button class="share-accept-btn">Accept</button>` +
                        `<button class="share-decline-btn">Decline</button>` +
                    `</div>`;

                row.querySelector('.share-accept-btn').addEventListener('click', async () => {
                    try {
                        await acceptShare(share.id, currentUser.uid);
                        row.remove();
                        if (!list.children.length) section.style.display = 'none';
                    } catch (e) {
                        alert('Failed to accept share. Please try again.');
                    }
                });

                row.querySelector('.share-decline-btn').addEventListener('click', async () => {
                    await declineShare(share.id);
                    row.remove();
                    if (!list.children.length) section.style.display = 'none';
                });

                list.appendChild(row);
            });
        }

        function esc(str) {
            return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        async function loadProfile(user) {
            const profile = await getUserProfile(user.uid);

            // Display name
            const nameInput = document.getElementById('displayNameInput');
            nameInput.value = profile?.display_name || user.user_metadata?.full_name || '';

            // Color
            selectedColor = profile?.avatar_color || COLORS[0].hex;
            swatchWrap.querySelectorAll('.color-swatch').forEach(btn => {
                if (btn.style.background === selectedColor || btn.style.backgroundColor === selectedColor) {
                    btn.classList.add('selected');
                }
            });
            // Match by hex value
            swatchWrap.querySelectorAll('.color-swatch').forEach(btn => {
                const matches = COLORS.find(c => c.hex === selectedColor);
                if (matches && btn.title === matches.name) btn.classList.add('selected');
            });

            updateAvatarPreview();
            loadDicePrefs(profile);

            // Account info
            document.getElementById('emailDisplay').value = user.email || '—';
            const emailAuth = await isEmailUser();
            document.getElementById('providerDisplay').value = emailAuth ? 'Email & Password' : 'Google';
            if (emailAuth) document.getElementById('passwordSection').style.display = 'block';
        }

        // ── Save profile ──────────────────────────────────────────────────────
        document.getElementById('saveProfileBtn').addEventListener('click', async () => {
            const name = document.getElementById('displayNameInput').value.trim();
            const err  = document.getElementById('profileError');
            const ok   = document.getElementById('profileSuccess');
            hide(err); hide(ok);

            if (!name) { show(err, 'Display name cannot be empty.'); return; }

            const btn = document.getElementById('saveProfileBtn');
            btn.disabled = true; btn.textContent = 'Saving…';
            try {
                await updateUserProfile(currentUser.uid, {
                    display_name: name,
                    avatar_color: selectedColor
                });
                show(ok);
                setTimeout(() => hide(ok), 3000);
            } catch (e) {
                console.error('Profile save error:', e);
                show(err, 'Failed to save. Please try again.');
            } finally {
                btn.disabled = false; btn.textContent = 'Save Changes';
            }
        });

        // ── Change password ───────────────────────────────────────────────────
        document.getElementById('savePasswordBtn').addEventListener('click', async () => {
            const current  = document.getElementById('currentPassword').value;
            const next     = document.getElementById('newPassword').value;
            const confirm  = document.getElementById('confirmPassword').value;
            const err      = document.getElementById('passwordError');
            const ok       = document.getElementById('passwordSuccess');
            hide(err); hide(ok);

            if (!current || !next || !confirm) { show(err, 'Please fill in all fields.'); return; }
            if (next.length < 6)               { show(err, 'New password must be at least 6 characters.'); return; }
            if (next !== confirm)               { show(err, 'Passwords do not match.'); return; }

            const btn = document.getElementById('savePasswordBtn');
            btn.disabled = true; btn.textContent = 'Updating…';
            try {
                await changePassword(current, next);
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                show(ok);
                setTimeout(() => hide(ok), 3000);
            } catch (e) {
                const m = (e.message || '').toLowerCase();
                const msg = m.includes('incorrect') || m.includes('invalid') ? 'Current password is incorrect.'
                    : m.includes('too many') ? 'Too many attempts. Try again later.'
                    : 'Failed to update password. Please try again.';
                show(err, msg);
            } finally {
                btn.disabled = false; btn.textContent = 'Update Password';
            }
        });

        function show(el, msg) { if (msg) el.textContent = msg; el.style.display = 'block'; }
        function hide(el) { el.style.display = 'none'; }
    </script>
</body>
</html>
