<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Brackenroll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="site-nav"></nav>

    <div class="auth-gate">
        <div class="auth-card">
            <div class="auth-card-eyebrow">Brackenroll</div>
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabSignIn">Sign In</button>
                <button class="auth-tab" id="tabRegister">Create Account</button>
            </div>

            <!-- Sign In panel -->
            <div class="auth-panel active" id="panelSignIn">
                <button class="btn-google" id="googleSignIn">
                    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-3.58-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                    Continue with Google
                </button>
                <button class="btn-discord" id="discordSignIn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
                    Continue with Discord
                </button>
                <div class="auth-divider">or</div>
                <p class="auth-error" id="signInError"></p>
                <div class="auth-field">
                    <label for="signInEmail">Email</label>
                    <input type="email" id="signInEmail" autocomplete="email" placeholder="you@example.com">
                </div>
                <div class="auth-field">
                    <label for="signInPassword">Password</label>
                    <input type="password" id="signInPassword" autocomplete="current-password" placeholder="••••••••">
                </div>
                <button class="btn-auth" id="emailSignInBtn">Sign In</button>
            </div>

            <!-- Register panel -->
            <div class="auth-panel" id="panelRegister">
                <button class="btn-google" id="googleRegister">
                    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-3.58-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                    Continue with Google
                </button>
                <button class="btn-discord" id="discordRegister">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
                    Continue with Discord
                </button>
                <div class="auth-divider">or</div>
                <p class="auth-error" id="registerError"></p>
                <div class="auth-field">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" autocomplete="email" placeholder="you@example.com">
                </div>
                <div class="auth-field">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" autocomplete="new-password" placeholder="At least 6 characters">
                </div>
                <button class="btn-auth" id="emailRegisterBtn">Create Account</button>
            </div>
        </div>
    </div>

    <script type="module" src="nav.js"></script>
    <script type="module">
        import { onAuthChange, signInWithGoogle, signInWithDiscord, emailSignIn, emailRegister } from './supabase-client.js';

        const params     = new URLSearchParams(window.location.search);
        const redirectTo = params.get('redirect') || 'index.html';
        const initialTab = params.get('tab') || 'signin';

        if (initialTab === 'register') setTab('register');

        // If already signed in, go to destination
        onAuthChange(user => {
            if (user) window.location.href = redirectTo;
        });

        // ── Tabs ──
        document.getElementById('tabSignIn').addEventListener('click',   () => setTab('signin'));
        document.getElementById('tabRegister').addEventListener('click', () => setTab('register'));

        function setTab(t) {
            document.getElementById('tabSignIn').classList.toggle('active',   t === 'signin');
            document.getElementById('tabRegister').classList.toggle('active', t === 'register');
            document.getElementById('panelSignIn').classList.toggle('active', t === 'signin');
            document.getElementById('panelRegister').classList.toggle('active', t === 'register');
        }

        // Store redirect in sessionStorage so index.html can pick it up after OAuth
        function storeOAuthRedirect() {
            if (redirectTo !== 'index.html') {
                sessionStorage.setItem('post_signin_redirect', redirectTo);
            }
        }

        // ── OAuth ──
        document.getElementById('googleSignIn').addEventListener('click', async () => {
            storeOAuthRedirect();
            const { error } = await signInWithGoogle();
            if (error) showErr(document.getElementById('signInError'), friendlyAuthError(error.message));
        });
        document.getElementById('googleRegister').addEventListener('click', async () => {
            storeOAuthRedirect();
            const { error } = await signInWithGoogle();
            if (error) showErr(document.getElementById('registerError'), friendlyAuthError(error.message));
        });
        document.getElementById('discordSignIn').addEventListener('click', async () => {
            storeOAuthRedirect();
            const { error } = await signInWithDiscord();
            if (error) showErr(document.getElementById('signInError'), friendlyAuthError(error.message));
        });
        document.getElementById('discordRegister').addEventListener('click', async () => {
            storeOAuthRedirect();
            const { error } = await signInWithDiscord();
            if (error) showErr(document.getElementById('registerError'), friendlyAuthError(error.message));
        });

        // ── Email sign in ──
        document.getElementById('emailSignInBtn').addEventListener('click', async () => {
            const email = document.getElementById('signInEmail').value.trim();
            const pass  = document.getElementById('signInPassword').value;
            const err   = document.getElementById('signInError');
            err.style.display = 'none';
            if (!email || !pass) { showErr(err, 'Please enter your email and password.'); return; }
            try { await emailSignIn(email, pass); }
            catch (e) { showErr(err, friendlyAuthError(e.message)); }
        });

        document.getElementById('signInPassword').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('emailSignInBtn').click();
        });

        // ── Email register ──
        document.getElementById('emailRegisterBtn').addEventListener('click', async () => {
            const email = document.getElementById('registerEmail').value.trim();
            const pass  = document.getElementById('registerPassword').value;
            const err   = document.getElementById('registerError');
            err.style.display = 'none';
            if (!email || !pass) { showErr(err, 'Please fill in all fields.'); return; }
            if (pass.length < 6) { showErr(err, 'Password must be at least 6 characters.'); return; }
            try { await emailRegister(email, pass); }
            catch (e) { showErr(err, friendlyAuthError(e.message)); }
        });

        document.getElementById('registerPassword').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('emailRegisterBtn').click();
        });

        function showErr(el, msg) { el.textContent = msg; el.style.display = 'block'; }

        function friendlyAuthError(msg = '') {
            const m = msg.toLowerCase();
            if (m.includes('invalid login') || m.includes('invalid credentials')) return 'Incorrect email or password.';
            if (m.includes('email not confirmed')) return 'Please confirm your email address before signing in.';
            if (m.includes('already registered') || m.includes('already in use')) return 'An account with that email already exists.';
            if (m.includes('password should be at least')) return 'Password must be at least 6 characters.';
            if (m.includes('invalid email') || m.includes('validate email')) return 'Please enter a valid email address.';
            if (m.includes('rate limit') || m.includes('too many')) return 'Too many attempts. Try again later.';
            return `Something went wrong: ${msg || 'Please try again.'}`;
        }
    </script>
</body>
</html>
