        // ── Konva stage ────────────────────────────────────────────────────────

        function initStage() {
            const wrap = document.getElementById('canvasWrap');
            document.getElementById('tableLoading').style.display = 'none';

            stage = new Konva.Stage({ container: 'konvaContainer', width: wrap.clientWidth, height: wrap.clientHeight });
            bgLayer    = new Konva.Layer();
            tokenLayer = new Konva.Layer();
            stage.add(bgLayer, tokenLayer);

            initFogLayer();
            drawBackground(resolveBackground());

            window.addEventListener('resize', () => {
                stage.width(wrap.clientWidth);
                stage.height(wrap.clientHeight);
                drawBackground(resolveBackground());
                repositionTokens();
                if (fogState.enabled) drawFogGroup();
            });
        }

        // Returns the image URL to show (null = dark grid only)
        function resolveBackground(sceneId) {
            const sid   = sceneId !== undefined ? sceneId : currentGmState.active_scene_id;
            const scene = sid ? scenesCache[sid] : null;
            if (scene) return scene.background === 'table' ? null : (scene.background || null);
            return currentGmState.mapUrl || null;
        }

        function drawBackground(mapUrl) {
            bgLayer.destroyChildren();
            const w = stage.width(), h = stage.height();
            bgLayer.add(new Konva.Rect({ x: 0, y: 0, width: w, height: h, fill: '#0e0b08' }));
            if (mapUrl) {
                const img = new window.Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const scale = Math.max(w / img.width, h / img.height);
                    const dw = img.width * scale, dh = img.height * scale;
                    bgLayer.add(new Konva.Image({ image: img, x: (w - dw) / 2, y: (h - dh) / 2, width: dw, height: dh }));
                    addGridLines(w, h);
                    bgLayer.draw();
                };
                img.onerror = () => { addGridLines(w, h); bgLayer.draw(); };
                img.src = mapUrl;
            } else {
                addGridLines(w, h);
                bgLayer.draw();
            }
        }

        function addGridLines(w, h) {
            const grid = 60;
            for (let x = 0; x <= w; x += grid)
                bgLayer.add(new Konva.Line({ points: [x, 0, x, h], stroke: 'rgba(201,168,76,0.06)', strokeWidth: 1 }));
            for (let y = 0; y <= h; y += grid)
                bgLayer.add(new Konva.Line({ points: [0, y, w, y], stroke: 'rgba(201,168,76,0.06)', strokeWidth: 1 }));
        }

        // ── Token sync ─────────────────────────────────────────────────────────

        function currentDisplaySceneId() {
            return isGM ? (gmPreviewSceneId ?? currentGmState.active_scene_id) : currentGmState.active_scene_id;
        }

        async function loadSceneTokens(sceneId) {
            if (unsubscribeTokens) { unsubscribeTokens(); unsubscribeTokens = null; }
            [sceneTokens, allTokenDefs] = await Promise.all([
                sceneId ? getSceneTokens(sceneId) : Promise.resolve([]),
                getTokenDefinitions(campaignId),
            ]);
            syncTokenNodes(sceneTokens);
            if (sceneId) {
                unsubscribeTokens = onSceneTokensChange(sceneId, async () => {
                    [sceneTokens, allTokenDefs] = await Promise.all([
                        getSceneTokens(sceneId),
                        getTokenDefinitions(campaignId),
                    ]);
                    syncTokenNodes(sceneTokens);
                });
            }
        }

        function tokenCanDrag(t) {
            if (isGM) return true;
            return !playerMoveLocked && t.player_moveable && t.owner_id === currentUser.uid;
        }

        function syncTokenNodes(tokens) {
            const activeIds = new Set(tokens.map(t => t.id));
            Object.keys(tokenNodes).forEach(id => {
                if (!activeIds.has(id)) { tokenNodes[id].destroy(); delete tokenNodes[id]; }
            });
            tokens.forEach(t => {
                if (t.id === draggingTokenId) return;
                if (!t.visible && !isGM) return;
                const canDrag = tokenCanDrag(t);
                if (tokenNodes[t.id]) {
                    tokenNodes[t.id].position(toPixels(t));
                    tokenNodes[t.id].draggable(canDrag);
                } else {
                    tokenNodes[t.id] = createTokenNode(t);
                    tokenLayer.add(tokenNodes[t.id]);
                }
            });
            tokenLayer.draw();
            renderTokensPanel();
        }

        function toPixels(t) { return { x: t.nx * stage.width(), y: t.ny * stage.height() }; }

        function repositionTokens() {
            sceneTokens.forEach(t => {
                if (t.id === draggingTokenId) return;
                const node = tokenNodes[t.id];
                if (node) node.position(toPixels(t));
            });
            tokenLayer.draw();
        }

        function createTokenNode(t) {
            const canDrag  = tokenCanDrag(t);
            const nameText = t.label || '?';
            const group    = new Konva.Group({ x: toPixels(t).x, y: toPixels(t).y, draggable: canDrag });

            group.add(new Konva.Circle({ radius: 26, fill: t.color || '#888', stroke: 'rgba(255,255,255,0.28)', strokeWidth: 2 }));
            group.add(new Konva.Text({ text: nameText.charAt(0).toUpperCase(), fontSize: 15, fontFamily: 'Cinzel', fontStyle: 'bold', fill: 'rgba(0,0,0,0.65)', offsetX: 4, offsetY: 7 }));
            group.add(new Konva.Text({ text: nameText, fontSize: 11, fontFamily: 'Cinzel', fill: '#e8dcc8', y: 32, offsetX: nameText.length * 3, visible: false, id: 'tooltip' }));

            group.on('mouseenter', () => { group.findOne('#tooltip').visible(true); tokenLayer.draw(); if (tokenCanDrag(t)) stage.container().style.cursor = 'grab'; });
            group.on('mouseleave', () => { group.findOne('#tooltip').visible(false); tokenLayer.draw(); stage.container().style.cursor = 'default'; });

            if (isGM) {
                group.on('contextmenu', e => {
                    e.evt.preventDefault();
                    const wrap = document.getElementById('canvasWrap');
                    const rect = wrap.getBoundingClientRect();
                    // Find the live token data so visibility state is current
                    const live = sceneTokens.find(s => s.id === t.id) ?? t;
                    showCtxMenu(live, e.evt.clientX - rect.left, e.evt.clientY - rect.top);
                });
            }

            group.on('dragstart', () => { draggingTokenId = t.id; stage.container().style.cursor = 'grabbing'; group.moveToTop(); });
            group.on('dragmove', () => {
                if (!broadcastChannel) return;
                const now = Date.now();
                if (now - lastBroadcastMs < 33) return;
                lastBroadcastMs = now;
                const pos = group.position();
                sendTokenMove(broadcastChannel, t.id, pos.x / stage.width(), pos.y / stage.height());
            });
            group.on('dragend', () => {
                draggingTokenId = null;
                stage.container().style.cursor = tokenCanDrag(t) ? 'grab' : 'default';
                const pos = group.position();
                const nx = pos.x / stage.width(), ny = pos.y / stage.height();
                const sceneId = currentDisplaySceneId();
                if (sceneId) upsertSceneToken(sceneId, t.id, nx, ny).catch(e => log.error('upsertSceneToken failed:', e));
            });

            return group;
        }

        // ── Broadcast token move (receive) ────────────────────────────────────

        function onRemoteTokenMove({ tokenId, nx, ny }) {
            if (tokenId === draggingTokenId) return;
            const node = tokenNodes[tokenId];
            if (!node || !stage) return;
            node.position({ x: nx * stage.width(), y: ny * stage.height() });
            tokenLayer.draw();
        }

        // ── Spawn tokens (GM only) ─────────────────────────────────────────────

        // ── Token context menu (GM only) ──────────────────────────────────────

        let ctxToken = null;

        function initTokenContextMenu() {
            const menu        = document.getElementById('tokenCtxMenu');
            const labelInput  = document.getElementById('tcmLabelInput');
            const saveBtn     = document.getElementById('tcmSaveLabel');
            const visBtn      = document.getElementById('tcmToggleVisible');
            const moveBtn     = document.getElementById('tcmToggleMoveable');
            const removeBtn   = document.getElementById('tcmRemove');

            saveBtn.addEventListener('click', async () => {
                if (!ctxToken) return;
                const { id } = ctxToken;
                const newLabel = labelInput.value.trim();
                if (!newLabel) return;
                hideCtxMenu();
                try { await updateTokenDefinition(id, { label: newLabel }); }
                catch (e) { log.error('rename token failed:', e); }
            });

            labelInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveBtn.click(); });

            visBtn.addEventListener('click', async () => {
                if (!ctxToken) return;
                const { id, visible } = ctxToken;
                const sceneId = currentDisplaySceneId();
                if (!sceneId) return;
                hideCtxMenu();
                try { await setSceneTokenVisibility(sceneId, id, !visible); }
                catch (e) { log.error('set visibility failed:', e); }
            });

            moveBtn.addEventListener('click', async () => {
                if (!ctxToken) return;
                const { id, player_moveable } = ctxToken;
                hideCtxMenu();
                try { await updateTokenDefinition(id, { player_moveable: !player_moveable }); }
                catch (e) { log.error('set moveable failed:', e); }
            });

            removeBtn.addEventListener('click', async () => {
                if (!ctxToken) return;
                const { id } = ctxToken;
                const sceneId = currentDisplaySceneId();
                if (!sceneId) return;
                hideCtxMenu();
                // Optimistic update — remove from canvas immediately.
                sceneTokens = sceneTokens.filter(t => t.id !== id);
                syncTokenNodes(sceneTokens);
                try { await removeSceneToken(sceneId, id); }
                catch (e) {
                    log.error('remove scene token failed:', e);
                    sceneTokens = await getSceneTokens(sceneId);
                    syncTokenNodes(sceneTokens);
                }
            });

            // Close on outside click or Escape
            document.addEventListener('click', e => {
                if (!menu.contains(e.target)) hideCtxMenu();
            });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtxMenu(); });
        }

        function showCtxMenu(token, x, y) {
            ctxToken = token;
            const menu       = document.getElementById('tokenCtxMenu');
            const labelInput = document.getElementById('tcmLabelInput');
            const visBtn     = document.getElementById('tcmToggleVisible');
            const moveBtn    = document.getElementById('tcmToggleMoveable');

            labelInput.value = token.label || '';
            visBtn.textContent  = token.visible        ? 'Hide from Players' : 'Show to Players';
            moveBtn.textContent = token.player_moveable ? 'Lock Movement'     : 'Unlock Movement';

            // Keep menu inside canvas bounds
            const wrap = document.getElementById('canvasWrap');
            const mw = 190, mh = 140;
            const cx = Math.min(x, wrap.clientWidth  - mw - 4);
            const cy = Math.min(y, wrap.clientHeight - mh - 4);
            menu.style.left    = cx + 'px';
            menu.style.top     = cy + 'px';
            menu.style.display = 'block';
            labelInput.focus();
            labelInput.select();
        }

        function hideCtxMenu() {
            document.getElementById('tokenCtxMenu').style.display = 'none';
            ctxToken = null;
        }

        // ── Quick-add token popover (GM only) ────────────────────────────────

        const QTP_COLORS = ['#c0392b','#2980b9','#27ae60','#8e44ad','#d4ac0d','#ca6f1e','#717d7e','#c0609a','#e8dcc8','#4a3e2e'];
        let qtpColor = QTP_COLORS[0];

        function initTokensPanel() {
            initPanelToggle('tokensPanel', 'btnSpawnTokens', { noPopOut: true });
            document.getElementById('btnSpawnCharTokens').addEventListener('click', spawnTokens);
        }

        function renderTokensPanel() {
            const list = document.getElementById('tokensPanelList');
            if (!list) return;
            const sceneId  = currentDisplaySceneId();
            const inSceneIds = new Set(sceneTokens.map(t => t.id));

            if (!allTokenDefs.length) {
                list.innerHTML = '<p class="tokens-empty">No tokens yet.</p>';
                return;
            }

            list.innerHTML = '';
            for (const def of allTokenDefs) {
                const row = document.createElement('div');
                row.className = 'tp-row';

                const dot = document.createElement('span');
                dot.className = 'tp-dot';
                dot.style.background = def.color || '#888';

                const label = document.createElement('span');
                label.className = 'tp-label';
                label.title = def.label;
                label.textContent = def.label;

                const typeSpan = document.createElement('span');
                typeSpan.className = 'tp-type';
                typeSpan.textContent = def.token_type === 'character' ? 'PC' : def.token_type === 'adversary' ? 'NPC' : 'GEN';

                if (inSceneIds.has(def.id)) {
                    const badge = document.createElement('span');
                    badge.className = 'tp-in-scene';
                    badge.textContent = '✓';
                    const delBtn = makeTokenDelBtn(def);
                    row.append(dot, label, typeSpan, badge, delBtn);
                } else {
                    const addBtn = document.createElement('button');
                    addBtn.className = 'tp-add-btn';
                    addBtn.textContent = 'Add';
                    addBtn.addEventListener('click', async () => {
                        if (!sceneId) return;
                        addBtn.disabled = true;
                        try { await upsertSceneToken(sceneId, def.id, 0.5, 0.5); }
                        catch (e) { log.error('add token to scene failed:', e); addBtn.disabled = false; }
                    });
                    const delBtn = makeTokenDelBtn(def);
                    row.append(dot, label, typeSpan, addBtn, delBtn);
                }

                list.appendChild(row);
            }
        }

        function makeTokenDelBtn(def) {
            const btn = document.createElement('button');
            btn.className = 'tp-del-btn';
            const isPC = def.token_type === 'character';
            btn.title = isPC ? 'PC tokens are managed automatically' : 'Delete from campaign';
            btn.textContent = '×';
            btn.disabled = isPC;
            if (!isPC) {
                btn.addEventListener('click', async () => {
                    if (!confirm(`Delete "${def.label}"? This removes it from all scenes.`)) return;
                    // Optimistic update — remove from local state immediately so canvas clears now.
                    allTokenDefs = allTokenDefs.filter(d => d.id !== def.id);
                    sceneTokens  = sceneTokens.filter(t => t.id !== def.id);
                    syncTokenNodes(sceneTokens);
                    try { await deleteTokenDefinition(def.id); }
                    catch (e) {
                        log.error('delete token definition failed:', e);
                        // Roll back on failure
                        allTokenDefs = await getTokenDefinitions(campaignId);
                        sceneTokens  = await getSceneTokens(currentDisplaySceneId());
                        syncTokenNodes(sceneTokens);
                    }
                });
            }
            return btn;
        }

        function initQuickTokenPopover() {
            const popover  = document.getElementById('quickTokenPopover');
            const labelIn  = document.getElementById('qtpLabel');
            const addBtn   = document.getElementById('qtpAdd');
            const swatches = document.getElementById('qtpSwatches');

            QTP_COLORS.forEach((hex, i) => {
                const s = document.createElement('button');
                s.type = 'button';
                s.className = 'qtp-swatch' + (i === 0 ? ' selected' : '');
                s.style.background = hex;
                s.addEventListener('click', () => {
                    qtpColor = hex;
                    swatches.querySelectorAll('.qtp-swatch').forEach(b => b.classList.remove('selected'));
                    s.classList.add('selected');
                });
                swatches.appendChild(s);
            });

            document.getElementById('btnQuickToken').addEventListener('click', e => {
                e.stopPropagation();
                popover.classList.toggle('open');
                if (popover.classList.contains('open')) { labelIn.value = ''; labelIn.focus(); }
            });

            addBtn.addEventListener('click', addQuickToken);
            labelIn.addEventListener('keydown', e => { if (e.key === 'Enter') addQuickToken(); if (e.key === 'Escape') popover.classList.remove('open'); });

            document.addEventListener('click', e => {
                if (!popover.contains(e.target) && e.target.id !== 'btnQuickToken') {
                    popover.classList.remove('open');
                }
            });
        }

        async function addQuickToken() {
            const label  = document.getElementById('qtpLabel').value.trim() || 'Token';
            const addBtn = document.getElementById('qtpAdd');
            addBtn.disabled = true;
            try {
                let sceneId = currentDisplaySceneId();
                if (!sceneId) {
                    // No scene active — use the first existing scene, or create one if none exist
                    let scene = scenesOrdered[0];
                    if (!scene) {
                        scene = await dbCreateScene(campaignId, 'Base Table', 'table');
                        scenesCache[scene.id] = scene;
                        scenesOrdered = [scene];
                    }
                    await pushScene(scene.id);
                    await loadSceneTokens(scene.id);
                    sceneId = scene.id;
                }
                const def = await createTokenDefinition(campaignId, {
                    label,
                    token_type:      'generic',
                    color:           qtpColor,
                    player_moveable: false,
                });
                await upsertSceneToken(sceneId, def.id, 0.5, 0.5);
                document.getElementById('quickTokenPopover').classList.remove('open');
            } finally {
                addBtn.disabled = false;
            }
        }

        function renderMoveLockBtn() {

        // Creates token_definitions for any player characters that don't have one yet.
        // Called automatically on GM boot — no scene placement.
        async function ensureCharacterTokens() {
            const existing = await getTokenDefinitions(campaignId);
            const existingCharIds = new Set(existing.filter(t => t.character_id).map(t => t.character_id));

            for (const m of members) {
                if (m.uid === campaign.gm_id) continue;
                const profile = profileMap[m.uid] ?? {};
                const ch      = (charMap[m.uid] ?? [])[0];
                if (!ch || existingCharIds.has(ch.id)) continue;
                await createTokenDefinition(campaignId, {
                    label:           ch.name || profile.display_name || 'Player',
                    token_type:      'character',
                    character_id:    ch.id,
                    owner_id:        m.uid,
                    color:           profile.avatar_color || '#888',
                    player_moveable: true,
                });
            }
        }

        // Places all character token_definitions into the current scene at default
        // positions for any that aren't already in the scene.
        async function spawnTokens() {
            const sceneId = currentDisplaySceneId();
            if (!sceneId) return;
            const [allDefs, currentTokens] = await Promise.all([
                getTokenDefinitions(campaignId),
                getSceneTokens(sceneId),
            ]);
            const placedDefIds = new Set(currentTokens.map(t => t.id));
            const charDefs = allDefs.filter(t => t.token_type === 'character');
            let col = currentTokens.filter(t => t.token_type === 'character').length;

            for (const def of charDefs) {
                if (placedDefIds.has(def.id)) continue;
                await upsertSceneToken(sceneId, def.id, 0.08 + col * 0.08, 0.5);
                col++;
            }
        }

        // ── Panel shell ────────────────────────────────────────────────────────

        function makeDraggable(el, handle, key) {
            let startX, startY, startLeft, startTop;
            handle.addEventListener('mousedown', e => {
                if (e.target.closest('button')) return;
                e.preventDefault();
                const elRect = el.getBoundingClientRect(), parentRect = el.offsetParent.getBoundingClientRect();
                startX = e.clientX; startY = e.clientY;
                startLeft = elRect.left - parentRect.left; startTop = elRect.top - parentRect.top;
                el.style.right = ''; el.style.left = startLeft + 'px'; el.style.top = startTop + 'px';
                const onMove = e => { el.style.left = (startLeft + e.clientX - startX) + 'px'; el.style.top = (startTop + e.clientY - startY) + 'px'; };
                const onUp   = () => { localStorage.setItem(`panel-${key}`, JSON.stringify({ x: parseFloat(el.style.left), y: parseFloat(el.style.top) })); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        function initPanelToggle(panelId, toggleId, { noPopOut } = {}) {
            const panel  = document.getElementById(panelId);
            const toggle = document.getElementById(toggleId);
            const key    = panel.dataset.panelKey;
            const header = panel.querySelector('.panel-header');

            const saved = JSON.parse(localStorage.getItem(`panel-${key}`) || 'null');
            if (saved) { panel.style.left = saved.x + 'px'; panel.style.top = saved.y + 'px'; panel.style.right = ''; }

            makeDraggable(panel, header, key);

            toggle.addEventListener('click', () => {
                const hidden = panel.classList.toggle('hidden');
                toggle.classList.toggle('active', !hidden);
            });
            panel.querySelector('.panel-close-btn').addEventListener('click', () => {
                panel.classList.add('hidden');
                toggle.classList.remove('active');
            });

            if (!noPopOut) {
                panel.querySelector('.panel-popout-btn')?.addEventListener('click', () => {
                    const w = window.open(`panel-${key}.html`, `brackenroll-panel-${key}`, 'width=320,height=480,toolbar=no,menubar=no,status=no,resizable=yes');
                    if (!w) { alert('Please allow pop-ups for this site.'); return; }
                    panel.classList.add('hidden');
                    toggle.classList.remove('active');
                });
            }
        }

        // ── Fog of War ─────────────────────────────────────────────────────────

        function initFogLayer() {
            fogLayer = new Konva.Layer();
            fogGroup = new Konva.Group({ listening: false });
            fogBrushCursor = new Konva.Circle({ radius: brushSize / 2, stroke: 'rgba(201,168,76,0.75)', strokeWidth: 1.5, dash: [4, 3], fill: 'rgba(201,168,76,0.06)', listening: false, visible: false });
            fogLayer.add(fogGroup);
            fogLayer.add(fogBrushCursor);
            stage.add(fogLayer);

            stage.container().addEventListener('mouseleave', () => {
                if (fogBrushCursor.visible()) { fogBrushCursor.visible(false); fogLayer.batchDraw(); }
            });

            document.addEventListener('keydown', e => {
                if (e.key !== 'Escape' || !fogDrawing) return;
                fogDrawing = false;
                if (fogPreview) { fogPreview.destroy(); fogPreview = null; }
                fogDrawStart = null;
                fogBrushPoints = [];
                fogLayer.batchDraw();
            });

            stage.on('mousedown', () => {
                if (!fogTool || !fogState.enabled) return;
                const pos = stage.getPointerPosition();
                if (!pos) return;
                if (fogTool === 'erase') { eraseAtPoint(pos.x, pos.y); return; }
                fogDrawing = true;
                if (fogTool === 'brush') {
                    fogBrushPoints = [pos.x, pos.y];
                    fogPreview = new Konva.Line({ points: [pos.x, pos.y, pos.x, pos.y + 0.1], stroke: 'rgba(201,168,76,0.5)', strokeWidth: brushSize, lineCap: 'round', lineJoin: 'round', listening: false });
                } else {
                    fogDrawStart = { ...pos };
                    const attrs = { stroke: 'rgba(201,168,76,0.7)', strokeWidth: 1, dash: [5, 3], fill: 'rgba(201,168,76,0.08)', listening: false };
                    fogPreview = fogTool === 'circle'
                        ? new Konva.Circle({ x: pos.x, y: pos.y, radius: 1, ...attrs })
                        : new Konva.Rect({ x: pos.x, y: pos.y, width: 1, height: 1, ...attrs });
                }
                fogLayer.add(fogPreview);
                fogLayer.batchDraw();
            });

            stage.on('mousemove', () => {
                const pos = stage.getPointerPosition();
                if (fogTool === 'brush' && pos) {
                    fogBrushCursor.position(pos);
                    if (!fogBrushCursor.visible()) fogBrushCursor.visible(true);
                    if (fogDrawing && fogPreview) {
                        const lx = fogBrushPoints[fogBrushPoints.length - 2], ly = fogBrushPoints[fogBrushPoints.length - 1];
                        const dx = pos.x - lx, dy = pos.y - ly;
                        if (Math.sqrt(dx * dx + dy * dy) >= 6) {
                            fogBrushPoints.push(pos.x, pos.y);
                            fogPreview.points(fogBrushPoints);
                        }
                    }
                    fogLayer.batchDraw();
                    return;
                }
                if (!fogDrawing || !fogPreview || !pos) return;
                if (fogTool === 'circle') {
                    const dx = pos.x - fogDrawStart.x, dy = pos.y - fogDrawStart.y;
                    fogPreview.radius(Math.max(1, Math.sqrt(dx * dx + dy * dy)));
                } else {
                    fogPreview.setAttrs({ x: Math.min(fogDrawStart.x, pos.x), y: Math.min(fogDrawStart.y, pos.y), width: Math.abs(pos.x - fogDrawStart.x), height: Math.abs(pos.y - fogDrawStart.y) });
                }
                fogLayer.batchDraw();
            });

            stage.on('mouseup', () => {
                if (!fogDrawing) return;
                fogDrawing = false;
                const pos = stage.getPointerPosition();
                if (fogPreview) { fogPreview.destroy(); fogPreview = null; }
                const shape = fogTool === 'brush' ? buildFogShape(null, null) : (pos && fogDrawStart) ? buildFogShape(fogDrawStart, pos) : null;
                fogDrawStart = null;
                if (shape) {
                    fogState = { ...fogState, shapes: [...fogState.shapes, shape] };
                    drawFogGroup();
                    persistFogState();
                    broadcastFogState();
                } else {
                    fogLayer.batchDraw();
                }
            });
        }

        function buildFogShape(start, end) {
            if (fogTool === 'brush') {
                if (fogBrushPoints.length < 4) return null;
                return { id: crypto.randomUUID(), type: 'brush', points: [...fogBrushPoints], strokeWidth: brushSize };
            }
            if (fogTool === 'circle') {
                const dx = end.x - start.x, dy = end.y - start.y;
                const radius = Math.sqrt(dx * dx + dy * dy);
                if (radius < 8) return null;
                return { id: crypto.randomUUID(), type: 'circle', x: Math.round(start.x), y: Math.round(start.y), radius: Math.round(radius) };
            }
            const w = Math.abs(end.x - start.x), h = Math.abs(end.y - start.y);
            if (w < 8 || h < 8) return null;
            return { id: crypto.randomUUID(), type: 'rect', x: Math.round(Math.min(start.x, end.x)), y: Math.round(Math.min(start.y, end.y)), width: Math.round(w), height: Math.round(h) };
        }

        function drawFogGroup() {
            fogGroup.destroyChildren();
            fogGroup.clearCache();
            if (!fogState.enabled) { fogLayer.batchDraw(); return; }
            const opacity = isGM ? 0.45 : 0.9;
            fogGroup.add(new Konva.Rect({ x: 0, y: 0, width: stage.width(), height: stage.height(), fill: `rgba(0,0,0,${opacity})`, listening: false }));
            (fogState.shapes || []).forEach(s => {
                let node;
                if (s.type === 'circle') {
                    node = new Konva.Circle({ x: s.x, y: s.y, radius: s.radius, fill: 'black', listening: false });
                } else if (s.type === 'brush') {
                    node = new Konva.Line({ points: s.points, stroke: 'black', strokeWidth: s.strokeWidth, lineCap: 'round', lineJoin: 'round', listening: false });
                } else {
                    node = new Konva.Rect({ x: s.x, y: s.y, width: s.width, height: s.height, fill: 'black', listening: false });
                }
                node.globalCompositeOperation('destination-out');
                fogGroup.add(node);
            });
            fogGroup.cache({ x: 0, y: 0, width: stage.width(), height: stage.height() });
            fogLayer.batchDraw();
        }

        function applyFogState(state) {
            fogState = (state && typeof state === 'object') ? { enabled: false, shapes: [], ...state } : { enabled: false, shapes: [] };
            drawFogGroup();
            if (isGM) renderFogPanel();
        }

        function eraseAtPoint(x, y) {
            if (!fogState.shapes.length) return;
            let target = null, bestArea = Infinity;
            for (const s of fogState.shapes) {
                let inside = false, area = 0;
                if (s.type === 'circle') {
                    const dx = x - s.x, dy = y - s.y;
                    inside = Math.sqrt(dx * dx + dy * dy) <= s.radius;
                    area   = Math.PI * s.radius * s.radius;
                } else if (s.type === 'brush') {
                    const hw = (s.strokeWidth || 40) / 2;
                    const pts = s.points;
                    for (let i = 0; i < pts.length - 1; i += 2) {
                        const dx = pts[i] - x, dy = pts[i + 1] - y;
                        if (Math.sqrt(dx * dx + dy * dy) <= hw) { inside = true; break; }
                    }
                    // approximate area as bounding box
                    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                    for (let i = 0; i < pts.length - 1; i += 2) { minX = Math.min(minX, pts[i]); maxX = Math.max(maxX, pts[i]); minY = Math.min(minY, pts[i + 1]); maxY = Math.max(maxY, pts[i + 1]); }
                    area = (maxX - minX + s.strokeWidth) * (maxY - minY + s.strokeWidth);
                } else {
                    inside = x >= s.x && x <= s.x + s.width && y >= s.y && y <= s.y + s.height;
                    area   = s.width * s.height;
                }
                if (inside && area < bestArea) { bestArea = area; target = s; }
            }
            if (!target) return;
            fogState = { ...fogState, shapes: fogState.shapes.filter(s => s.id !== target.id) };
            drawFogGroup();
            persistFogState();
            broadcastFogState();
        }

        function persistFogState() {
            const sceneId = currentDisplaySceneId();
            if (!sceneId) return;
            saveFogState(sceneId, fogState)
                .then(() => { if (scenesCache[sceneId]) scenesCache[sceneId].fog_state = fogState; })
                .catch(e => log.error('saveFogState failed:', e));
        }

        function broadcastFogState() {
            if (broadcastChannel) sendFogUpdate(broadcastChannel, fogState);
            broadcastPanelState();
        }

        function onRemoteFogUpdate(payload) {
            if (isGM) return;
            applyFogState(payload);
        }

        function setFogTool(tool) {
            if (fogDrawing) {
                fogDrawing = false;
                if (fogPreview) { fogPreview.destroy(); fogPreview = null; fogLayer.batchDraw(); }
                fogDrawStart = null;
            }
            fogTool = tool;
            if (tokenLayer) tokenLayer.listening(!tool);
            if (stage) stage.container().style.cursor = tool === 'brush' ? 'none' : tool === 'erase' ? 'cell' : (tool ? 'crosshair' : 'default');
            if (fogBrushCursor) { fogBrushCursor.visible(false); if (fogLayer) fogLayer.batchDraw(); }
            renderFogPanel();
        }

        function applyFogToggle() {
            if (!currentDisplaySceneId()) return;
            fogState = { ...fogState, enabled: !fogState.enabled };
            if (!fogState.enabled) setFogTool(null);
            drawFogGroup();
            renderFogPanel();
            persistFogState();
            broadcastFogState();
        }

        function applyFogRevealAll() {
            if (!fogState.enabled) return;
            const w = stage.width(), h = stage.height();
            fogState = { ...fogState, shapes: [{ id: crypto.randomUUID(), type: 'rect', x: 0, y: 0, width: w, height: h }] };
            drawFogGroup();
            renderFogPanel();
            persistFogState();
            broadcastFogState();
        }

        function applyFogReset() {
            if (!fogState.enabled) return;
            fogState = { ...fogState, shapes: [] };
            drawFogGroup();
            renderFogPanel();
            persistFogState();
            broadcastFogState();
        }

        function initFogPanel() {
            initPanelToggle('fogPanel', 'btnFogPanel');
            document.getElementById('btnFogToggle').addEventListener('click', applyFogToggle);
            document.querySelectorAll('.fog-tool-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (!fogState.enabled) return;
                    setFogTool(btn.dataset.tool === fogTool ? null : btn.dataset.tool);
                });
            });
            const slider = document.getElementById('fogBrushSlider');
            slider.addEventListener('input', () => {
                brushSize = parseInt(slider.value);
                document.getElementById('fogBrushValue').textContent = brushSize;
                if (fogBrushCursor) fogBrushCursor.radius(brushSize / 2);
            });
            document.getElementById('btnFogRevealAll').addEventListener('click', applyFogRevealAll);
            document.getElementById('btnFogReset').addEventListener('click', () => {
                if (!fogState.enabled) return;
                if (!confirm('Clear all fog reveals?')) return;
                applyFogReset();
            });
            renderFogPanel();
        }

        function renderFogPanel() {
            const toggleBtn = document.getElementById('btnFogToggle');
            if (!toggleBtn) return;
            const enabled  = fogState.enabled;
            const hasScene = !!currentDisplaySceneId();
            toggleBtn.textContent = enabled ? 'On' : 'Off';
            toggleBtn.classList.toggle('fog-on', enabled);
            toggleBtn.disabled = !hasScene;
            document.querySelectorAll('.fog-tool-btn').forEach(btn => {
                btn.disabled = !enabled;
                btn.classList.toggle('active', enabled && btn.dataset.tool === fogTool);
            });
            document.getElementById('fogBrushRow').style.display = (enabled && fogTool === 'brush') ? 'flex' : 'none';
            document.getElementById('btnFogRevealAll').disabled = !enabled;
            document.getElementById('btnFogReset').disabled     = !enabled;
            const hint = document.getElementById('fogHint');
            hint.textContent = !hasScene ? 'Push a scene to enable fog.' : '';
        }

        function renderParchmentsPanel() {
            const list = document.getElementById('parchLibList');
            if (!list) return;
            if (!campaignParchments.length) {
                list.innerHTML = '<p class="parch-lib-empty">No saved parchments yet.</p>';
                return;
            }
            list.innerHTML = '';
            for (const p of campaignParchments) {
                const type = p.canvas_data?.type || 'drawing';
                const icon = type === 'image' ? '🖼' : type === 'text' ? '📜' : '✍';
                const row = document.createElement('div');
                row.className = 'parch-lib-row';
                row.innerHTML = `
                    <span class="parch-lib-icon">${icon}</span>
                    <span class="parch-lib-name" title="${escHtml(p.name)}">${escHtml(p.name)}</span>
                    <button class="parch-lib-btn" data-action="open" data-id="${p.id}">Open</button>
                    <button class="parch-lib-btn" data-action="send" data-id="${p.id}">Send</button>
                    <button class="parch-lib-btn danger" data-action="del" data-id="${p.id}">✕</button>`;
                row.querySelector('[data-action=open]').addEventListener('click', () => openSavedParchmentOnTable(p.id));
                row.querySelector('[data-action=send]').addEventListener('click', e => showSendPopover(p.id, e.currentTarget));
                row.querySelector('[data-action=del]').addEventListener('click', async () => {
                    if (!confirm(`Delete "${p.name}"?`)) return;

                        await deleteParchment(p.id);

                        renderParchmentsPanel();
                        broadcastPanelState();
                    } catch (err) { log.error('deleteParchment failed:', err); }
                });
                list.appendChild(row);
            }

        async function openNewParchment() {
            const ap = await createActiveParchment(currentUser.uid, session.id, campaignId, {

        async function openSavedParchmentOnTable(parchmentId) {
            const p = campaignParchments.find(x => x.id === parchmentId);
            if (!p) return;

                label:       p.name,
                canvas_data: p.canvas_data,
            });
            openActiveParchmentOverlay(ap, false);
            if (broadcastChannel) sendParchmentOpen(broadcastChannel, ap);

        function openActiveParchmentOverlay(ap, silent) {
            if (document.getElementById(`parch-${ap.id}`)) return;

            const wrap   = document.getElementById('parchOverlayContainer');
            const canvasW = 540, canvasH = 360;

            // Stagger new parchments so they don't perfectly overlap
            const offset = Object.keys(activeParchmentsMap).length * 22;
            const startX = ap.x ? ap.x * document.getElementById('canvasWrap').clientWidth  : 60 + offset;
            const startY = ap.y ? ap.y * document.getElementById('canvasWrap').clientHeight : 60 + offset;

            const overlay = document.createElement('div');
            overlay.className = 'parchment-overlay';
            overlay.id = `parch-${ap.id}`;
            overlay.style.left = startX + 'px';
            overlay.style.top  = startY + 'px';

            // Header
            const header = document.createElement('div');
            header.className = 'parchment-header';

            const title = document.createElement('span');
            title.className = 'parchment-title';
            title.textContent = ap.label || 'Untitled';

            // Tool buttons
            const penBtn   = makeParchToolBtn('✒', 'Pen',    'pen');
            const eraseBtn = makeParchToolBtn('◻', 'Eraser', 'eraser');
            penBtn.classList.add('active');

            // Color dots
            const colorDots = INK_COLORS.map((c, i) => {
                const dot = document.createElement('span');
                dot.className = 'parch-color-dot' + (i === 0 ? ' active' : '');
                dot.title = c.label;
                dot.style.background = c.value;
                dot.dataset.color = c.value;
                return dot;
            });

            const sep1 = document.createElement('span');
            sep1.className = 'parch-sep';

            // Size slider
            const sizeRow = document.createElement('div');
            sizeRow.className = 'parch-size-row';
            const sizeSlider = document.createElement('input');
            sizeSlider.type = 'range'; sizeSlider.min = '1'; sizeSlider.max = '16'; sizeSlider.value = '4';
            sizeSlider.className = 'parch-size-slider';

            sizeRow.appendChild(sizeSlider);

            const sep2 = document.createElement('span');
            sep2.className = 'parch-sep';

            // Close button
            const closeBtn = document.createElement('button');
            closeBtn.className = 'panel-icon-btn';
            closeBtn.title = 'Close';
            closeBtn.textContent = '×';

            header.append(title, penBtn, eraseBtn, sep1, ...colorDots, sep2, sizeRow, closeBtn);

            // Drawing canvas
            const canvas = document.createElement('canvas');
            canvas.className = 'parchment-canvas';
            canvas.style.width  = canvasW + 'px';
            canvas.style.height = canvasH + 'px';

            // Footer
            const footer = document.createElement('div');
            footer.className = 'parch-footer';

            const clearBtn = document.createElement('button');
            clearBtn.className = 'parch-action-btn danger';
            clearBtn.textContent = 'Clear';

            const spacer = document.createElement('div');
            spacer.className = 'parch-footer-spacer';

            const whoEl = document.createElement('div');
            whoEl.className = 'parch-who';
            whoEl.id = `parch-who-${ap.id}`;

            const footerRight = document.createElement('div');
            footerRight.style.cssText = 'display:flex;gap:5px;position:relative;';

            const saveBtn = document.createElement('button');
            saveBtn.className = 'parch-action-btn';
            saveBtn.textContent = 'Save';

            const sendBtn = document.createElement('button');
            sendBtn.className = 'parch-action-btn';
            sendBtn.textContent = 'Send';

            footerRight.append(saveBtn, sendBtn);
            footer.append(clearBtn, spacer, whoEl, footerRight);

            overlay.append(header, canvas, footer);
            wrap.appendChild(overlay);

            // Init drawing engine
            const bg = ap.canvas_data?.background || 'parchment';
            const drawing = new ParchmentDraw(canvas, {
                background: bg,
                onStrokeComplete: stroke => onLocalParchmentStroke(ap.id, stroke),
            });
            drawing.loadStrokes(ap.canvas_data?.strokes || []);

            activeParchmentsMap[ap.id] = { ap, drawing };

            // Wire up tools
            penBtn.addEventListener('click', () => {
                drawing.setTool('pen');
                penBtn.classList.add('active');
                eraseBtn.classList.remove('active');
            });
            eraseBtn.addEventListener('click', () => {
                drawing.setTool('eraser');
                eraseBtn.classList.add('active');
                penBtn.classList.remove('active');
            });
            colorDots.forEach(dot => {
                dot.addEventListener('click', () => {
                    colorDots.forEach(d => d.classList.remove('active'));
                    dot.classList.add('active');
                    drawing.setColor(dot.dataset.color);
                    // Switch back to pen if on eraser
                    if (drawing.tool === 'eraser') {
                        drawing.setTool('pen');
                        penBtn.classList.add('active');
                        eraseBtn.classList.remove('active');
                    }
                });
            });
            sizeSlider.addEventListener('input', () => drawing.setWidth(parseInt(sizeSlider.value)));

            clearBtn.addEventListener('click', () => {
                if (!confirm('Clear this parchment?')) return;
                drawing.clear();
                scheduleParchSave(ap.id, drawing);
            });

            saveBtn.addEventListener('click', () => saveParchmentToLibrary(ap.id, drawing));
            sendBtn.addEventListener('click', e => showSendPopoverForActive(ap.id, e.currentTarget, drawing));

            closeBtn.addEventListener('click', () => closeActiveParchmentOverlay(ap.id));

            makeDraggable(overlay, header, `parch-${ap.id}`);
        }

        function makeParchToolBtn(icon, title, tool) {
            const btn = document.createElement('button');
            btn.className = 'parch-tool-btn';
            btn.title = title;
            btn.textContent = icon;
            btn.dataset.tool = tool;
            return btn;
        }

        function onLocalParchmentStroke(activeParchmentId, stroke) {
            if (broadcastChannel) sendParchmentStroke(broadcastChannel, activeParchmentId, stroke);
            scheduleParchSave(activeParchmentId, activeParchmentsMap[activeParchmentId]?.drawing);
        }

        function scheduleParchSave(activeParchmentId, drawing) {
            if (!drawing) return;
            if (parchSaveTimers[activeParchmentId]) clearTimeout(parchSaveTimers[activeParchmentId]);
            parchSaveTimers[activeParchmentId] = setTimeout(() => {
                delete parchSaveTimers[activeParchmentId];
                const entry = activeParchmentsMap[activeParchmentId];
                if (!entry) return;
                const canvas_data = { ...(entry.ap.canvas_data || {}), strokes: drawing.getStrokes() };
                updateActiveParchmentData(activeParchmentId, canvas_data)
                    .catch(e => log.error('updateActiveParchmentData failed:', e));
            }, 2500);
        }

        async function closeActiveParchmentOverlay(activeParchmentId) {
            const overlay = document.getElementById(`parch-${activeParchmentId}`);
            if (overlay) overlay.remove();
            if (parchSaveTimers[activeParchmentId]) {
                clearTimeout(parchSaveTimers[activeParchmentId]);
                delete parchSaveTimers[activeParchmentId];
            }
            const entry = activeParchmentsMap[activeParchmentId];
            delete activeParchmentsMap[activeParchmentId];
            if (broadcastChannel) sendParchmentClose(broadcastChannel, activeParchmentId);
            broadcastPanelState();
            if (entry) {
                // Final save then delete from active table
                const canvas_data = { ...(entry.ap.canvas_data || {}), strokes: entry.drawing.getStrokes() };
                try {
                    await updateActiveParchmentData(activeParchmentId, canvas_data);
                    await deleteActiveParchment(activeParchmentId);
                } catch (e) { log.error('closeActiveParchment cleanup failed:', e); }
            }
        }

        async function saveParchmentToLibrary(activeParchmentId, drawing) {
            const entry = activeParchmentsMap[activeParchmentId];
            if (!entry) return;

            const name = prompt('Save as:', entry.ap.label || 'Untitled');
            if (!name) return;

            const canvas_data = {
                type:       'drawing',
                background: drawing.getBackground(),
                strokes:    drawing.getStrokes(),
            };
            try {
                const saved = await saveParchment(currentUser.uid, campaignId, { name, canvas_data });
                campaignParchments = [saved, ...campaignParchments];
                renderParchmentsPanel();
                broadcastPanelState();
            } catch (e) { log.error('saveParchment failed:', e); alert('Failed to save parchment.'); }
        }

        function showSendPopover(parchmentId, anchor) {
            const p = campaignParchments.find(x => x.id === parchmentId);
            if (!p) return;
            openSendPopover(anchor, async selectedUids => {
                for (const uid of selectedUids) {
                    try {
                        await sendParchmentToPlayer(parchmentId, uid, null);
                    } catch (e) { log.error('sendParchmentToPlayer failed:', e); }
                }
                if (broadcastChannel && selectedUids.length) {
                    sendParchmentDelivery(broadcastChannel, { name: p.name, canvas_data: p.canvas_data, recipientIds: selectedUids });
                }
            });
        }

        async function showSendPopoverForActive(activeParchmentId, anchor, drawing) {
            // Save to library first if not already saved, then send
            const canvas_data = { type: 'drawing', background: drawing.getBackground(), strokes: drawing.getStrokes() };
            openSendPopover(anchor, async selectedUids => {
                try {
                    const name = activeParchmentsMap[activeParchmentId]?.ap.label || 'Parchment';
                    const saved = await saveParchment(currentUser.uid, campaignId, { name, canvas_data });
                    campaignParchments = [saved, ...campaignParchments];
                    renderParchmentsPanel();
                    for (const uid of selectedUids) {
                        await sendParchmentToPlayer(saved.id, uid, null);
                    }
                    if (broadcastChannel) sendParchmentDelivery(broadcastChannel, { name: saved.name, canvas_data, recipientIds: selectedUids });
                } catch (e) { log.error('showSendPopoverForActive failed:', e); alert('Failed to send parchment.'); }
            });
        }

        function openSendPopover(anchor, onConfirm) {
            // Remove any existing popover
            document.querySelectorAll('.parch-send-popover').forEach(p => p.remove());

            const players = members.filter(m => m.uid !== campaign.gm_id);
            if (!players.length) { alert('No players in this campaign.'); return; }

            const pop = document.createElement('div');
            pop.className = 'parch-send-popover open';

            const title = document.createElement('div');
            title.className = 'parch-send-title';
            title.textContent = 'Send to Players';
            pop.appendChild(title);

            const checks = [];
            players.forEach(m => {
                const profile = profileMap[m.uid] ?? {};
                const row = document.createElement('label');
                row.className = 'parch-send-player';
                const cb = document.createElement('input');
                cb.type = 'checkbox'; cb.checked = true; cb.value = m.uid;
                const name = document.createElement('span');
                name.className = 'parch-send-player-name';
                name.textContent = profile.display_name || 'Player';
                row.append(cb, name);
                pop.appendChild(row);
                checks.push(cb);
            });

            const btn = document.createElement('button');
            btn.className = 'parch-send-confirm';
            btn.textContent = 'Send';
            btn.addEventListener('click', () => {
                const selected = checks.filter(c => c.checked).map(c => c.value);
                pop.remove();
                if (selected.length) onConfirm(selected);
            });
            pop.appendChild(btn);

            anchor.parentElement.style.position = 'relative';
            anchor.parentElement.appendChild(pop);

            const closeOnOutside = e => {
                if (!pop.contains(e.target) && e.target !== anchor) {
                    pop.remove();
                    document.removeEventListener('click', closeOnOutside);
                }
            };
            setTimeout(() => document.addEventListener('click', closeOnOutside), 0);
        }

        // ── Parchment broadcast receivers ──────────────────────────────────────

        function onRemoteParchmentStroke({ id, stroke }) {
            const entry = activeParchmentsMap[id];
            if (entry) entry.drawing.applyStroke(stroke);
        }

        function onRemoteParchmentOpen(ap) {
            if (!activeParchmentsMap[ap.id]) openActiveParchmentOverlay(ap, true);
        }

        function onRemoteParchmentClose({ id }) {
            const overlay = document.getElementById(`parch-${id}`);
            if (overlay) overlay.remove();
            delete activeParchmentsMap[id];
            broadcastPanelState();
        }

        function onRemoteParchmentDelivery(payload) {
            // Only show toast to the actual recipients
            if (!payload.recipientIds?.includes(currentUser.uid)) return;
            showParchmentToast(payload.name, payload.canvas_data);
        }

        // ── Parchment toast & lightbox ─────────────────────────────────────────

        let _toastTimer = null;

        function showParchmentToast(name, canvas_data) {
            pendingToastParch = { name, canvas_data };
            const toast = document.getElementById('parchToast');
            document.getElementById('parchToastText').textContent = `You received: "${name}"`;
            toast.classList.add('visible');
            if (_toastTimer) clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => toast.classList.remove('visible'), 12000);
        }

        function initParchmentToast() {
            document.getElementById('parchToastView').addEventListener('click', () => {
                document.getElementById('parchToast').classList.remove('visible');
                if (pendingToastParch) openParchmentLightbox(pendingToastParch.name, pendingToastParch.canvas_data);
            });
            document.getElementById('parchToastDismiss').addEventListener('click', () => {
                document.getElementById('parchToast').classList.remove('visible');
            });
            document.getElementById('parchLightboxClose').addEventListener('click', () => {
                document.getElementById('parchLightbox').classList.remove('visible');
            });
        }

        function openParchmentLightbox(name, canvas_data) {
            const lb      = document.getElementById('parchLightbox');
            const lbTitle = document.getElementById('parchLightboxTitle');
            const lbCanvas = document.getElementById('parchLightboxCanvas');

            lbTitle.textContent = name || 'Parchment';
            lbCanvas.style.width  = '540px';
            lbCanvas.style.height = '360px';

            lb.classList.add('visible');

            const d = new ParchmentDraw(lbCanvas, {
                background: canvas_data?.background || 'parchment',
                readOnly: true,
            });
            d.loadStrokes(canvas_data?.strokes || []);

        // ── GM BroadcastChannel ────────────────────────────────────────────────

        function initGmPanelChannel() {
            panelChannel.onmessage = e => {
                const { type, value, id, name, segments } = e.data;
                switch (type) {
                    case 'panel_ready':          broadcastPanelState(); break;
                    case 'fear_set':             applyFear(Math.max(0, Math.min(12, value))); break;
                    case 'fear_plus':            applyFear(Math.min(12, (currentGmState.fear || 0) + 1)); break;
                    case 'fear_minus':           applyFear(Math.max(0,  (currentGmState.fear || 0) - 1)); break;
                    case 'fear_toggle_visible':  applyFearVisible(!(currentGmState.fearVisible || false)); break;
                    case 'clock_tick':           applyClockTick(id); break;
                    case 'clock_toggle_visible': applyClockToggleVisible(id); break;
                    case 'clock_delete':         applyClockDelete(id); break;
                    case 'clock_add':            applyClockAdd(name, segments); break;
                    case 'fog_toggle':           applyFogToggle();    break;
                    case 'fog_reveal_all':       applyFogRevealAll(); break;
                    case 'fog_reset':            applyFogReset();     break;
                    case 'parch_open_new':       openNewParchment();  break;
                    case 'parch_open_saved':     openSavedParchmentOnTable(e.data.parchmentId); break;
                    case 'parch_delete': {
                        const pid = e.data.parchmentId;
                        if (!pid) break;
                        deleteParchment(pid).then(() => {
                            campaignParchments = campaignParchments.filter(x => x.id !== pid);
                            renderParchmentsPanel();
                            broadcastPanelState();
                        }).catch(err => log.error('panel parch_delete failed:', err));
                        break;
                    }
                }
            };
        }

        function broadcastPanelState() {
            panelChannel.postMessage({ type: 'state_update', payload: {
                fear:              currentGmState.fear || 0,
                fearVisible:       currentGmState.fearVisible || false,
                clocks:            currentGmState.clocks || [],
                fogEnabled:        fogState.enabled,
                fogShapeCount:     (fogState.shapes || []).length,
                fogHasScene:       !!currentDisplaySceneId(),
                parchmentCount:    campaignParchments.length,
                activeParchCount:  Object.keys(activeParchmentsMap).length,
                parchmentList:     campaignParchments.map(p => ({ id: p.id, name: p.name, canvas_data: { type: p.canvas_data?.type } })),
                campaignId,
            }});
        }

        // ── Scenes ─────────────────────────────────────────────────────────────

        function initScenes() {
            initPanelToggle('scenesPanel', 'btnScenesPanel', { noPopOut: true });

            // Background type picker
            document.querySelectorAll('.bg-opt').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.bg-opt').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    newSceneBgType = btn.dataset.bg;
                    document.getElementById('sceneBgUrl').style.display  = newSceneBgType === 'url'    ? 'block' : 'none';
                    document.getElementById('sceneBgFile').style.display = newSceneBgType === 'upload' ? 'block' : 'none';
                    if (newSceneBgType === 'upload') document.getElementById('sceneBgFile').click();
                });
            });

            document.getElementById('btnCreateScene').addEventListener('click', createSceneFromForm);
            document.getElementById('sceneNameInput').addEventListener('keydown', e => { if (e.key === 'Enter') createSceneFromForm(); });

            renderScenes();
        }

        function renderScenes() {
            const listEl  = document.getElementById('sceneList');
            const pushedId = currentGmState.active_scene_id;
            listEl.innerHTML = '';

            // Base Table row (always first)
            const baseItem = document.createElement('div');
            baseItem.className = 'scene-item' + (!pushedId ? ' pushed' : '') + (!gmPreviewSceneId ? ' previewing' : '');
            baseItem.innerHTML = `
                <div class="scene-dot"></div>
                <div class="scene-name">Base Table</div>
                <div class="scene-item-btns">
                    <button class="scene-item-btn push" title="Push to players">→</button>
                </div>`;
            baseItem.addEventListener('click', e => { if (!e.target.closest('button')) previewSceneLocally(null); });
            baseItem.querySelector('.push').addEventListener('click', () => pushScene(null));
            listEl.appendChild(baseItem);

            if (!scenesOrdered.length) {
                const empty = document.createElement('div');
                empty.className = 'scenes-empty';
                empty.textContent = 'No scenes yet.';
                listEl.appendChild(empty);
                return;
            }

            scenesOrdered.forEach(scene => {
                const isPushed    = scene.id === pushedId;
                const isPreviewing = scene.id === gmPreviewSceneId;
                const item = document.createElement('div');
                item.className = 'scene-item' + (isPushed ? ' pushed' : '') + (isPreviewing ? ' previewing' : '');
                item.innerHTML = `
                    <div class="scene-dot"></div>
                    <div class="scene-name">${escHtml(scene.name)}</div>
                    <div class="scene-item-btns">
                        <button class="scene-item-btn push" title="Push to players">→</button>
                        <button class="scene-item-btn del" title="Delete scene">✕</button>
                    </div>`;
                item.addEventListener('click', e => { if (!e.target.closest('button')) previewSceneLocally(scene.id); });
                item.querySelector('.push').addEventListener('click', () => pushScene(scene.id));
                item.querySelector('.del' ).addEventListener('click', () => removeScene(scene.id));
                listEl.appendChild(item);
            });
        }

        function previewSceneLocally(sceneId) {
            gmPreviewSceneId = sceneId;
            drawBackground(resolveBackground(sceneId));
            applyFogState((sceneId ? scenesCache[sceneId] : null)?.fog_state);
            loadSceneTokens(currentDisplaySceneId()).catch(e => log.error('loadSceneTokens failed:', e));
            renderScenes();
        }

        async function pushScene(sceneId) {
            gmPreviewSceneId = sceneId;
            currentGmState = { ...currentGmState, active_scene_id: sceneId };
            drawBackground(resolveBackground(sceneId));
            applyFogState((sceneId ? scenesCache[sceneId] : null)?.fog_state);
            updateSceneLabel();
            renderScenes();
            await updateGmState(session.id, { active_scene_id: sceneId });
        }

        async function createSceneFromForm() {
            const name = document.getElementById('sceneNameInput').value.trim();
            if (!name) { document.getElementById('sceneNameInput').focus(); return; }

            let background = 'table';
            if (newSceneBgType === 'url') {
                background = document.getElementById('sceneBgUrl').value.trim() || 'table';
            } else if (newSceneBgType === 'upload') {
                const file = document.getElementById('sceneBgFile').files[0];
                if (file) {
                    const btn = document.getElementById('btnCreateScene');
                    btn.textContent = 'Uploading…'; btn.disabled = true;
                    try {
                        const { publicUrl } = await uploadAsset(campaignId, 'map', file);
                        background = publicUrl;
                    } catch (e) {
                        log.error('Scene upload failed:', e);
                    } finally {
                        btn.textContent = '+ Create Scene'; btn.disabled = false;
                    }
                }
            }

            const scene = await dbCreateScene(campaignId, name, background);
            scenesCache[scene.id] = scene;
            scenesOrdered.push(scene);
            document.getElementById('sceneNameInput').value = '';
            document.getElementById('sceneBgUrl').value = '';
            document.getElementById('sceneBgFile').value = '';
            renderScenes();
        }

        async function removeScene(sceneId) {
            if (currentGmState.active_scene_id === sceneId) {
                await pushScene(null);
            }
            if (gmPreviewSceneId === sceneId) previewSceneLocally(null);
            try {
                await dbDeleteScene(sceneId);
            } catch (e) {
                log.error('delete scene failed:', e);
                return;
            }
            delete scenesCache[sceneId];
            scenesOrdered = scenesOrdered.filter(s => s.id !== sceneId);
            renderScenes();
        }

        // ── Fear Tracker ───────────────────────────────────────────────────────

        function initFearTracker() {
            initPanelToggle('fearPanel', 'btnFearPanel');
            document.getElementById('btnFearMinus' ).addEventListener('click', () => applyFear(Math.max(0,  (currentGmState.fear || 0) - 1)));
            document.getElementById('btnFearPlus'  ).addEventListener('click', () => applyFear(Math.min(12, (currentGmState.fear || 0) + 1)));
            document.getElementById('btnFearVisible').addEventListener('click', () => applyFearVisible(!(currentGmState.fearVisible || false)));
            renderFear();
        }

        function renderFear() {
            const fear    = currentGmState.fear        || 0;
            const visible = currentGmState.fearVisible || false;
            const pipsEl  = document.getElementById('fearPips');
            if (pipsEl) {
                pipsEl.innerHTML = '';
                for (let i = 1; i <= 12; i++) {
                    const pip = document.createElement('div');
                    pip.className = 'fear-pip' + (i <= fear ? ' filled' : '');
                    pip.addEventListener('click', () => applyFear(i));
                    pipsEl.appendChild(pip);
                }
            }
            const countEl = document.getElementById('fearCount');
            if (countEl) countEl.textContent = fear;
            const visBtn = document.getElementById('btnFearVisible');
            if (visBtn) { visBtn.textContent = visible ? 'Shown to Players' : 'Hidden from Players'; visBtn.classList.toggle('visible', visible); }
            broadcastPanelState();
        }

        async function applyFear(value) {
            currentGmState = { ...currentGmState, fear: value };
            renderFear(); renderPlayerHud();
            await updateGmState(session.id, { fear: value });
        }

        async function applyFearVisible(visible) {
            currentGmState = { ...currentGmState, fearVisible: visible };
            renderFear(); renderPlayerHud();
            await updateGmState(session.id, { fearVisible: visible });
        }

        // ── Countdown Clocks ───────────────────────────────────────────────────

        function initClocks() {
            initPanelToggle('clocksPanel', 'btnClocksPanel');
            document.querySelectorAll('.seg-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    newClockSegments = parseInt(btn.dataset.segs);
                });
            });
            document.getElementById('btnAddClock').addEventListener('click', () => {
                const name = document.getElementById('clockNameInput').value.trim();
                if (!name) { document.getElementById('clockNameInput').focus(); return; }
                applyClockAdd(name, newClockSegments);
                document.getElementById('clockNameInput').value = '';
            });
            document.getElementById('clockNameInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnAddClock').click(); });
            renderClocks();
        }

        function renderClocks() {
            const clocks = currentGmState.clocks || [];
            const listEl = document.getElementById('clockList');
            if (!listEl) return;
            listEl.innerHTML = '';
            if (!clocks.length) { listEl.innerHTML = '<div class="clocks-empty">No clocks yet.</div>'; broadcastPanelState(); return; }
            clocks.forEach(clock => {
                const pct  = Math.round((clock.filled / clock.segments) * 100);
                const item = document.createElement('div');
                item.className = 'clock-item';
                item.innerHTML = `
                    <div class="clock-pie" data-id="${clock.id}" style="background:conic-gradient(#c9a84c ${pct}%,#2a2318 ${pct}%);" title="Click to tick"></div>
                    <div class="clock-info">
                        <div class="clock-name">${escHtml(clock.name)}</div>
                        <div class="clock-progress">${clock.filled}/${clock.segments}</div>
                    </div>
                    <div class="clock-item-actions">
                        <button class="clock-action-btn${clock.visible ? ' vis-on' : ''}" data-id="${clock.id}" data-action="toggle">${clock.visible ? '👁' : '○'}</button>
                        <button class="clock-action-btn" data-id="${clock.id}" data-action="tick">+1</button>
                        <button class="clock-action-btn danger" data-id="${clock.id}" data-action="delete">✕</button>
                    </div>`;
                item.querySelector('.clock-pie').addEventListener('click', () => applyClockTick(clock.id));
                item.querySelectorAll('[data-action]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const { action, id } = btn.dataset;
                        if (action === 'tick')   applyClockTick(id);
                        if (action === 'toggle') applyClockToggleVisible(id);
                        if (action === 'delete') applyClockDelete(id);
                    });
                });
                listEl.appendChild(item);
            });
            broadcastPanelState();
        }

        async function applyClockAdd(name, segments) {
            const clocks = [...(currentGmState.clocks || []), { id: crypto.randomUUID(), name, segments, filled: 0, visible: false }];
            currentGmState = { ...currentGmState, clocks }; renderClocks(); renderPlayerHud();
            await updateGmState(session.id, { clocks });
        }
        async function applyClockTick(id) {
            const clocks = (currentGmState.clocks || []).map(c => c.id === id ? { ...c, filled: Math.min(c.segments, c.filled + 1) } : c);
            currentGmState = { ...currentGmState, clocks }; renderClocks(); renderPlayerHud();
            await updateGmState(session.id, { clocks });
        }
        async function applyClockToggleVisible(id) {
            const clocks = (currentGmState.clocks || []).map(c => c.id === id ? { ...c, visible: !c.visible } : c);
            currentGmState = { ...currentGmState, clocks }; renderClocks(); renderPlayerHud();
            await updateGmState(session.id, { clocks });
        }
        async function applyClockDelete(id) {
            const clocks = (currentGmState.clocks || []).filter(c => c.id !== id);
            currentGmState = { ...currentGmState, clocks }; renderClocks(); renderPlayerHud();
            await updateGmState(session.id, { clocks });
        }

        // ── Encounter Runner ───────────────────────────────────────────────────

        // ── Loot Panel ────────────────────────────────────────────────────────

            initPanelToggle('lootPanel', 'btnLootPanel');

                loadLootData(),
                getLootHomebrew(campaignId),

                        <option value="items">Items</option>
                        <option value="consumables">Consumables</option>
                        <option value="both">Both (mixed)</option>
                    </select>
                </div>
                <div class="loot-ctrl-row">
                    <span class="loot-ctrl-label">Count</span>
                    <select class="loot-ctrl-select" id="lootCount">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>
                <button class="loot-roll-btn" id="lootRollBtn" ${lootData ? '' : 'disabled'}>Roll Loot</button>`;

            const resultsDiv = document.createElement('div');
            resultsDiv.className = 'loot-results';
            resultsDiv.id = 'lootResultsDiv';
            if (!lootResults.length) {
                resultsDiv.innerHTML = '<div class="loot-empty">Roll to generate loot.</div>';
            } else {
                lootResults.forEach((item, idx) => resultsDiv.appendChild(buildLootCard(item, idx)));
            }

            body.innerHTML = '';
            body.append(controls, resultsDiv);

            body.querySelector('#lootRollBtn').addEventListener('click', () => {
                if (!lootData) return;
                lootRarity  = document.getElementById('lootRarity').value;
                lootType    = document.getElementById('lootType').value;
                const count = parseInt(document.getElementById('lootCount').value, 10);
                lootResults = lootUseHomebrew && lootHomebrew.length
                    ? rollSetWithHomebrew(lootRarity, lootType, count, lootData, lootHomebrew)
                    : rollSet(lootRarity, lootType, count, lootData);
                const rd = document.getElementById('lootResultsDiv');
                rd.innerHTML = '';
                lootResults.forEach((item, idx) => rd.appendChild(buildLootCard(item, idx)));
            });
        }

        function buildLootCard(item, idx) {
            const card = document.createElement('div');
            card.className = 'loot-result-card';

            const main = document.createElement('div');
            main.className = 'loot-result-main';
            main.innerHTML =
                `<div class="loot-result-name">${escHtml(item.name)}</div>` +
                `<div class="loot-result-desc">${escHtml(item.description)}</div>` +
                `<div class="loot-result-meta loot-r-${item.rarity}">${escHtml(item.rarity)} · ${escHtml(item.type)}${item.homebrew ? ' · homebrew' : ''}</div>`;

            const rerollBtn = document.createElement('button');
            rerollBtn.className = 'loot-reroll-btn';
            rerollBtn.title = 'Re-roll';
            rerollBtn.textContent = '↻';
            rerollBtn.addEventListener('click', () => {
                lootResults[idx] = lootUseHomebrew && lootHomebrew.length
                    ? rollOneWithHomebrew(lootRarity, lootType, lootData, lootHomebrew)
                    : rollOne(lootRarity, lootType, lootData);
                card.replaceWith(buildLootCard(lootResults[idx], idx));
            });

            card.append(main, rerollBtn);
            return card;

        function initEncounterPanel() {
            initPanelToggle('encounterPanel', 'btnEncounterPanel', { noPopOut: true });
            renderEncounterPanel();
        }

        function renderEncounterPanel() {
            const body = document.getElementById('encounterPanelBody');
            if (!body) return;
            body.innerHTML = '';
            if (currentGmState.encounter) {
                renderEncounterLive(body);
            } else {
                renderEncounterBrowse(body);
            }
        }

        function renderEncounterBrowse(body) {
            const section = document.createElement('div');
            section.className = 'enc-panel-section';

            const title = document.createElement('div');
            title.className = 'enc-browse-title';
            title.textContent = 'Load an Encounter';

            const list = document.createElement('div');
            list.className = 'enc-browse-list';

            if (!gmEncounters.length) {
                list.innerHTML = '<div class="enc-empty-note">No encounters yet. Build them in the Encounter Builder.</div>';
            } else {
                gmEncounters.forEach(enc => {
                    const row = document.createElement('div');
                    row.className = 'enc-browse-row';

                    const info = document.createElement('div');
                    info.className = 'enc-browse-info';
                    info.innerHTML = `<div class="enc-browse-name">${escHtml(enc.name)}</div><div class="enc-browse-meta">${enc.entry_count} adversar${enc.entry_count !== 1 ? 'ies' : 'y'}</div>`;

                    const loadBtn = document.createElement('button');

                    loadBtn.textContent = 'Load';

                    row.append(info, loadBtn);
                    list.appendChild(row);
                });
