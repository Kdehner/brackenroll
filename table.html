        function renderEncounterLive(body) {
            const enc = currentGmState.encounter;

            const header = document.createElement('div');
            header.className = 'enc-live-header';

            const nameEl = document.createElement('div');
            nameEl.className = 'enc-live-name';
            nameEl.title = enc.name;
            nameEl.textContent = enc.name;

            const endBtn = document.createElement('button');
            endBtn.className = 'enc-end-btn';
            endBtn.textContent = 'End';
            endBtn.addEventListener('click', applyEncounterEnd);

            header.append(nameEl, endBtn);
            body.appendChild(header);

            const entries = document.createElement('div');
            entries.className = 'enc-entries';

            const entryList = enc.entries || [];
            if (!entryList.length) {
                entries.innerHTML = '<div class="enc-empty-note">No adversaries in this encounter.</div>';
            } else {
                entryList.forEach(e => entries.appendChild(buildEncounterEntryRow(e)));
            }
            body.appendChild(entries);

            const addSection = document.createElement('div');
            addSection.className = 'enc-add-section';

            const addBtn = document.createElement('button');
            addBtn.className = 'enc-panel-add-btn';
            addBtn.textContent = encPickerVisible ? '− Close Picker' : '+ Add Adversary';
            addBtn.addEventListener('click', () => {
                encPickerVisible = !encPickerVisible;
                encPickerSearch  = '';
                renderEncounterPanel();
            });
            addSection.appendChild(addBtn);

            if (encPickerVisible) addSection.appendChild(buildEncounterPicker());
            body.appendChild(addSection);
        }

        function buildEncounterEntryRow(entry) {
            const hasHp   = entry.hp_max != null;
            const bloodied = hasHp && entry.hp_max > 0 && entry.hp_current <= entry.hp_max / 2;
            const defeated = entry.defeated;

            const row = document.createElement('div');
            row.className = 'enc-entry-row' + (defeated ? ' defeated' : '') + (bloodied && !defeated ? ' bloodied' : '');

            const top = document.createElement('div');
            top.className = 'enc-entry-top';

            const label = document.createElement('span');
            label.className = 'enc-entry-label';
            label.textContent = entry.label;
            top.appendChild(label);

            if (bloodied && !defeated) {
                const badge = document.createElement('span');
                badge.className = 'enc-bloodied-badge';
                badge.textContent = 'Bloodied';
                top.appendChild(badge);
            }

            const controls = document.createElement('div');
            controls.className = 'enc-entry-controls';

            const minus = document.createElement('button');
            minus.className = 'enc-hp-btn';
            minus.textContent = '−';
            minus.addEventListener('click', () => applyEncounterHpChange(entry.encounter_entry_id, -1));

            const hpEl = document.createElement('div');
            hpEl.className = 'enc-hp-display';
            hpEl.textContent = hasHp ? `${entry.hp_current}/${entry.hp_max}` : '—';

            const plus = document.createElement('button');
            plus.className = 'enc-hp-btn';
            plus.textContent = '+';
            plus.addEventListener('click', () => applyEncounterHpChange(entry.encounter_entry_id, +1));

            const defeatBtn = document.createElement('button');
            defeatBtn.className = 'enc-defeat-btn' + (defeated ? ' active' : '');
            defeatBtn.title = defeated ? 'Mark active' : 'Mark defeated';
            defeatBtn.textContent = defeated ? 'Revive' : 'Defeat';
            defeatBtn.addEventListener('click', () => applyEncounterDefeat(entry.encounter_entry_id));

            controls.append(minus, hpEl, plus, defeatBtn);
            row.append(top, controls);
            return row;
        }

        function buildEncounterPicker() {
            const picker = document.createElement('div');
            picker.className = 'enc-picker';

            const search = document.createElement('input');
            search.type = 'search';
            search.className = 'enc-picker-search';
            search.placeholder = 'Search adversaries…';
            search.value = encPickerSearch;

            const tabs = document.createElement('div');
            tabs.className = 'enc-picker-tabs';

            const offTab = document.createElement('button');
            offTab.className = 'enc-picker-tab' + (encPickerTab === 'official' ? ' active' : '');
            offTab.textContent = 'Official';

            const custTab = document.createElement('button');
            custTab.className = 'enc-picker-tab' + (encPickerTab === 'custom' ? ' active' : '');
            custTab.textContent = 'Custom';

            const list = document.createElement('div');
            list.className = 'enc-picker-list';

            const switchTab = tab => {
                encPickerTab = tab;
                encPickerSearch = '';
                search.value = '';
                offTab.classList.toggle('active', tab === 'official');
                custTab.classList.toggle('active', tab === 'custom');
                renderEncPickerList(list);
            };
            offTab.addEventListener('click',  () => switchTab('official'));
            custTab.addEventListener('click', () => switchTab('custom'));

            search.addEventListener('input', e => {
                encPickerSearch = e.target.value;
                renderEncPickerList(list);
            });

            tabs.append(offTab, custTab);
            picker.append(search, tabs, list);

            renderEncPickerList(list);
            return picker;
        }

        function renderEncPickerList(list) {
            list.innerHTML = '';
            const q = encPickerSearch.toLowerCase();

            if (encPickerTab === 'official') {
                if (!encOfficialAdv) {
                    list.innerHTML = '<div class="enc-picker-empty">Loading…</div>';
                    getOfficialAdv().then(() => renderEncPickerList(list));
                    return;
                }
                const filtered = encOfficialAdv
                    .filter(a => !q || (a.name || '').toLowerCase().includes(q))
                    .slice(0, 50);
                if (!filtered.length) { list.innerHTML = '<div class="enc-picker-empty">No matches.</div>'; return; }
                filtered.forEach(adv => list.appendChild(buildEncPickerItem(adv, false)));
            } else {
                if (!encCustomAdv) {
                    list.innerHTML = '<div class="enc-picker-empty">Loading…</div>';
                    getCustomAdv().then(() => renderEncPickerList(list));
                    return;
                }
                const filtered = encCustomAdv.filter(a => !q || a.name.toLowerCase().includes(q));
                if (!filtered.length) {
                    list.innerHTML = `<div class="enc-picker-empty">${encCustomAdv.length === 0 ? 'No custom adversaries.' : 'No matches.'}</div>`;
                    return;
                }
                filtered.forEach(adv => list.appendChild(buildEncPickerItem(adv, true)));
            }
        }

        function buildEncPickerItem(adv, isCustom) {
            const name = isCustom ? adv.name : adv.name.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
            const item = document.createElement('div');
            item.className = 'enc-picker-item';

            const nameEl = document.createElement('div');
            nameEl.className = 'enc-picker-item-name';
            nameEl.title = name;
            nameEl.textContent = name;

            const tierEl = document.createElement('div');
            tierEl.className = 'enc-picker-item-tier';
            tierEl.textContent = adv.tier ? `T${adv.tier}` : '';

            const addBtn = document.createElement('button');
            addBtn.className = 'enc-picker-add-btn';
            addBtn.textContent = '+ Add';
            addBtn.addEventListener('click', () => handleEncounterAddMid(adv, isCustom, addBtn));

            item.append(nameEl, tierEl, addBtn);
            return item;
        }

        // Lazy-load helpers
        async function getOfficialAdv() {
            if (!encOfficialAdv) encOfficialAdv = await fetch('/data/base/adversaries.json').then(r => r.json());
            return encOfficialAdv;
        }
        async function getCustomAdv() {
            if (!encCustomAdv) encCustomAdv = await getAdversaries(campaignId);
            return encCustomAdv;
        }

        function lookupAdversaryHp(entry, official, custom) {
            if (entry.adversary_id) return official.find(a => a.id === entry.adversary_id)?.hp ?? null;
            if (entry.custom_adversary_id) return custom.find(a => a.id === entry.custom_adversary_id)?.hp ?? null;
            return null;
        }

        async function loadEncounterToRunner(encounterId, btn) {
            btn.disabled = true;
            btn.textContent = 'Loading…';
            try {
                const [encData, official, custom] = await Promise.all([
                    getEncounterWithEntries(encounterId),
                    getOfficialAdv(),
                    getCustomAdv(),
                ]);
                const entries = (encData.encounter_entries || [])
                    .sort((a, b) => a.sort_order - b.sort_order)
                    .map(e => {
                        const hp = lookupAdversaryHp(e, official, custom);
                        return {
                            encounter_entry_id:   e.id,
                            label:                e.label,
                            adversary_id:         e.adversary_id,
                            custom_adversary_id:  e.custom_adversary_id,
                            token_definition_id:  e.token_definitions?.id,
                            hp_max:               hp,
                            hp_current:           hp,
                            conditions:           [],
                            defeated:             false,
                        };
                    });
                const encounterState = { encounter_id: encData.id, name: encData.name, loaded_at: new Date().toISOString(), entries };
                currentGmState = { ...currentGmState, encounter: encounterState };
                renderEncounterPanel();
                await updateGmState(session.id, { encounter: encounterState });
            } catch (err) {
                log.error('loadEncounterToRunner failed:', err);
                btn.disabled = false;
                btn.textContent = 'Load';
            }
        }

        async function applyEncounterHpChange(entryId, delta) {
            const enc     = currentGmState.encounter;
            const entries = enc.entries.map(e => {
                if (e.encounter_entry_id !== entryId) return e;
                const maxHp  = e.hp_max ?? 99;
                const newCur = Math.max(0, Math.min(maxHp, (e.hp_current ?? 0) + delta));
                return { ...e, hp_current: newCur };
            });
            const updated = { ...enc, entries };
            currentGmState = { ...currentGmState, encounter: updated };
            renderEncounterPanel();
            await updateGmState(session.id, { encounter: updated });
        }

        async function applyEncounterDefeat(entryId) {
            const enc     = currentGmState.encounter;
            const entries = enc.entries.map(e =>
                e.encounter_entry_id === entryId ? { ...e, defeated: !e.defeated } : e
            );
            const updated = { ...enc, entries };
            currentGmState = { ...currentGmState, encounter: updated };
            renderEncounterPanel();
            await updateGmState(session.id, { encounter: updated });
        }

        async function applyEncounterEnd() {
            if (!confirm('End this encounter? Live HP tracking will be cleared.')) return;
            const updated = { ...currentGmState };
            delete updated.encounter;
            currentGmState   = updated;
            encPickerVisible = false;
            renderEncounterPanel();
            gmEncounters = await getEncounters(campaignId);
            await updateGmState(session.id, { encounter: null });
        }

        async function handleEncounterAddMid(adv, isCustom, btn) {
            btn.disabled = true;
            btn.textContent = '…';
            try {
                const enc     = currentGmState.encounter;
                const sceneId = currentDisplaySceneId();
                const newEntry = await addEncounterEntry(currentUser.uid, {
                    encounterId: enc.encounter_id,
                    campaignId,
                    sceneId,
                    adversary: adv,
                    isCustom,
                });
                const hp = adv.hp ?? null;
                const liveEntry = {
                    encounter_entry_id:  newEntry.id,
                    label:               newEntry.label,
                    adversary_id:        newEntry.adversary_id,
                    custom_adversary_id: newEntry.custom_adversary_id,
                    token_definition_id: newEntry.token_definition_id,
                    hp_max:              hp,
                    hp_current:          hp,
                    conditions:          [],
                    defeated:            false,
                };
                const entries = [...(enc.entries || []), liveEntry];
                const updated = { ...enc, entries };
                currentGmState   = { ...currentGmState, encounter: updated };
                encPickerVisible = false;
                encPickerSearch  = '';
                renderEncounterPanel();
                await updateGmState(session.id, { encounter: updated });
                // Refresh token state so new token appears on canvas
                allTokenDefs = await getTokenDefinitions(campaignId);
                if (sceneId) {
                    sceneTokens = await getSceneTokens(sceneId);
                    syncTokenNodes(sceneTokens);
                }
                renderTokensPanel();
            } catch (err) {
                log.error('handleEncounterAddMid failed:', err);
                alert('Failed to add adversary to encounter.');
                btn.disabled = false;
                btn.textContent = '+ Add';
            }
        }

        // ── Player HUD ─────────────────────────────────────────────────────────

        function renderPlayerHud() {
            const hud    = document.getElementById('playerHud');
            const fear   = currentGmState.fear        || 0;
            const fVis   = currentGmState.fearVisible || false;

        function initRollsPanel() {
            const toggle = document.getElementById('rollsToggle');
            const panel  = document.getElementById('rollsPanel');
            toggle.addEventListener('click', () => {
                const open = panel.classList.toggle('open');

        async function initDiceBox() {
            const { default: DiceBox } = await import('/assets/dice-box/dice-box.es.min.js');
            diceBox = new DiceBox({
                assetPath: '/assets/dice-box/assets/',
                container: '#canvasWrap',
                gravity: 1,
                mass: 1,
                friction: 0.8,
                restitution: 0.1,
                angularDamping: 0.6,
                linearDamping: 0.6,
                throwForce: 3,
                spinForce: 2,
                startingHeight: 8,
                settleTimeout: 5000,
                offscreen: true,
                scale: 6,
                onRollComplete: handleRollComplete,
            });
            await diceBox.init();

            // Enable tray now that dice-box is ready
            document.getElementById('btnDuality').disabled = false;
            document.getElementById('btnHope').disabled = false;
            document.getElementById('btnFear').disabled = false;
            document.querySelectorAll('.die-btn').forEach(b => b.disabled = false);

            document.getElementById('btnDuality').addEventListener('click', rollDuality);
            document.getElementById('btnHope').addEventListener('click', rollHope);
            document.getElementById('btnFear').addEventListener('click', rollFear);
            document.querySelectorAll('.die-btn').forEach(btn => {
                btn.addEventListener('click', () => addDie(parseInt(btn.dataset.sides)));
            });
            document.getElementById('btnRollExecute').addEventListener('click', rollPending);
        }

        function addDie(sides) {
            pendingDice[sides] = (pendingDice[sides] || 0) + 1;
            renderPendingDisplay();
        }

        function renderPendingDisplay() {
            const display = document.getElementById('dicePendingDisplay');
            const btn = document.getElementById('btnRollExecute');
            const entries = Object.entries(pendingDice)
                .filter(([, n]) => n > 0)
                .sort(([a], [b]) => parseInt(a) - parseInt(b));
            if (!entries.length) {
                display.textContent = '';
                btn.disabled = true;
                return;
            }
            display.textContent = entries.map(([s, n]) => `${n}d${s}`).join(' + ');
            btn.disabled = false;
        }

        function myDicePrefs() {
            const prefs = (profileMap[currentUser.uid] ?? {}).dice_prefs ?? {};
            return {
                standard_theme: prefs.standard_theme || 'smooth',
                hope_theme:     prefs.hope_theme     || 'default',
                fear_theme:     prefs.fear_theme     || 'rust',
            };
        }

        function rollDuality() {
            if (!diceBox) return;
            diceBox.clear();
            const prefs = myDicePrefs();
            pendingRollType = 'duality';
            pendingRollGroups = [
                { qty: 1, sides: 12, theme: prefs.hope_theme },
                { qty: 1, sides: 12, theme: prefs.fear_theme },
            ];
            diceBox.roll(pendingRollGroups);
        }

        function rollHope() {
            if (!diceBox) return;
            diceBox.clear();
            const prefs = myDicePrefs();
            pendingRollType = 'standard';
            pendingRollGroups = [{ qty: 1, sides: 12, theme: prefs.hope_theme }];
            diceBox.roll(pendingRollGroups);
        }

        function rollFear() {
            if (!diceBox) return;
            diceBox.clear();
            const prefs = myDicePrefs();
            pendingRollType = 'standard';
            pendingRollGroups = [{ qty: 1, sides: 12, theme: prefs.fear_theme }];
            diceBox.roll(pendingRollGroups);
        }

        function rollPending() {
            if (!diceBox) return;
            const entries = Object.entries(pendingDice).filter(([, n]) => n > 0);
            if (!entries.length) return;
            diceBox.clear();
            const prefs = myDicePrefs();
            pendingRollType = 'standard';
            pendingRollGroups = entries
                .sort(([a], [b]) => parseInt(a) - parseInt(b))
                .map(([s, n]) => ({ qty: n, sides: parseInt(s), theme: prefs.standard_theme }));
            pendingDice = {};
            renderPendingDisplay();
            diceBox.roll(pendingRollGroups);
        }

        let _clearTimer = null;
        function scheduleDiceClear() {
            if (_clearTimer) clearTimeout(_clearTimer);
            _clearTimer = setTimeout(() => { if (diceBox) diceBox.clear(); }, 12000);
        }

        function handleRollComplete(groups) {
            const rollType   = pendingRollType;
            const rollConfig = pendingRollGroups;
            const profile    = profileMap[currentUser.uid] ?? {};
            const name       = profile.display_name || 'Player';
            const avatarColor = profile.avatar_color || '#888';

            const rollData = {
                uid: currentUser.uid,
                display_name: name,
                avatar_color: avatarColor,
                roll_type: rollType,
                groups: groups.map((g, i) => ({
                    qty:    rollConfig[i]?.qty    ?? g.qty,
                    sides:  rollConfig[i]?.sides,
                    theme:  rollConfig[i]?.theme,
                    values: (g.rolls || []).map(r => r.value),
                })),
                timestamp: new Date().toISOString(),
            };
            addSessionRoll(campaignId, session.id, rollData);
            showRollAttribution(rollData);
            scheduleDiceClear();
        }

        let _attribTimer = null;
        function showRollAttribution(rollData) {
            const overlay = document.getElementById('rollAttribOverlay');
            let label = escHtml(rollData.display_name) + ' rolled';
            if (rollData.roll_type === 'duality') {
                const hopeVal = rollData.groups[0]?.values[0] ?? '?';
                const fearVal = rollData.groups[1]?.values[0] ?? '?';
                const withHope = hopeVal >= fearVal;
                const critical = hopeVal === fearVal;
                const outcome  = critical ? 'Critical!' : (withHope ? 'With Hope' : 'With Fear');
                label += ` — Hope: ${hopeVal} | Fear: ${fearVal} — ${outcome}`;
            } else {
                const totals = rollData.groups.map(g => g.values.reduce((a, b) => a + b, 0));
                label += ` ${totals.join(' + ')}`;
                if (totals.length > 1) label += ` = ${totals.reduce((a, b) => a + b, 0)}`;
            }
            overlay.textContent = label;
            overlay.style.display = 'block';
            overlay.classList.remove('fading');
            if (_attribTimer) clearTimeout(_attribTimer);
            _attribTimer = setTimeout(() => {
                overlay.classList.add('fading');
                setTimeout(() => { overlay.style.display = 'none'; overlay.classList.remove('fading'); }, 650);
            }, 4000);
        }

        function renderRolls(rolls) {
            const feed = document.getElementById('rollsFeed');
            feed.innerHTML = '';
            if (!rolls.length) { feed.innerHTML = '<p class="rolls-empty">No rolls yet.</p>'; return; }
            rolls.forEach(r => {
                const card = document.createElement('div');
                card.className = 'roll-card';
                card.innerHTML = buildRollCard(r);
                feed.appendChild(card);
            });
        }

        function buildRollCard(r) {
            const initials = (r.display_name || '?').charAt(0).toUpperCase();
            const color    = escHtml(r.avatar_color || '#555');
            const name     = escHtml(r.display_name || 'Player');
            let diceHtml   = '';
            let resultHtml = '';

            if (r.roll_type === 'duality') {
                const hopeVal  = r.groups[0]?.values[0] ?? '?';
                const fearVal  = r.groups[1]?.values[0] ?? '?';
                const withHope = hopeVal >= fearVal;
                const critical = hopeVal === fearVal;
                const resultClass = critical ? 'critical' : (withHope ? 'with-hope' : 'with-fear');
                const resultText  = critical ? 'Critical!' : (withHope ? 'With Hope' : 'With Fear');
                diceHtml = `
                    <div class="roll-die"><div class="roll-die-label hope">Hope</div><div class="roll-die-value hope">${hopeVal}</div></div>
                    <div class="roll-separator">+</div>
                    <div class="roll-die"><div class="roll-die-label fear">Fear</div><div class="roll-die-value fear">${fearVal}</div></div>
                    <div class="roll-total">${+hopeVal + +fearVal}</div>`;
                resultHtml = `<div class="roll-result ${resultClass}">${resultText}</div>`;
            } else {
                const parts = (r.groups || []).map(g => {
                    const label = `${g.qty}d${g.sides}`;
                    const vals  = (g.values || []).join(', ');
                    const total = (g.values || []).reduce((a, b) => a + b, 0);
                    return `<div class="roll-die"><div class="roll-die-label">${escHtml(label)}</div><div class="roll-die-value">${total}</div></div>`;
                });
                const grand = (r.groups || []).flatMap(g => g.values || []).reduce((a, b) => a + b, 0);
                diceHtml = parts.join('<div class="roll-separator">+</div>') + `<div class="roll-total">${grand}</div>`;
            }

            return `
                <div class="roll-card-header">
                    <div class="roll-card-avatar" style="background:${color}">${initials}</div>
                    <div class="roll-card-name">${name}</div>
                </div>
                <div class="roll-card-dice">${diceHtml}</div>
                ${resultHtml}`;
        }

        // ── Session listener (async — may need to fetch scene) ─────────────────

        async function onSessionUpdate(updatedSession) {
            if (!updatedSession || updatedSession.is_active === false) {
                if (unsubscribe) unsubscribe();
                window.location.href = `campaign.html?id=${campaignId}`;
                return;
            }

            const prevSceneId    = currentGmState.active_scene_id;
            const prevMoveLocked = playerMoveLocked;
            const gs = updatedSession.gm_state || {};
            currentGmState   = { mapUrl: '', fear: 0, fearVisible: false, clocks: [], active_scene_id: null, ...gs };
            playerMoveLocked = updatedSession.player_move_locked ?? false;
            const newSceneId = currentGmState.active_scene_id;

            // Fetch scene if we haven't cached it yet (happens on player clients)
            if (newSceneId && !scenesCache[newSceneId]) {
                const scene = await getScene(newSceneId);
                if (scene) scenesCache[scene.id] = scene;
            }

            // Redraw background only when the pushed scene changes
            if (newSceneId !== prevSceneId) {
                if (!isGM) {
                    drawBackground(resolveBackground());
                    applyFogState((newSceneId ? scenesCache[newSceneId] : null)?.fog_state);
                    await loadSceneTokens(newSceneId);
                }
                updateSceneLabel();
                if (isGM) renderScenes();
            }

            // Re-sync drag permissions if lock state changed
            if (playerMoveLocked !== prevMoveLocked && tokenLayer) {
                syncTokenNodes(sceneTokens);
                if (isGM) renderMoveLockBtn();
            }

            if (isGM) { renderFear(); renderClocks(); renderEncounterPanel(); }
            renderPlayerHud();
        }
    </script>
</body>
