<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parchments — Brackenroll GM</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #14110d;
            color: #e8dcc8;
            font-family: 'Cinzel', serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            gap: 12px;
            overflow: hidden;
        }
        h1 { font-size: 0.62em; letter-spacing: 0.22em; text-transform: uppercase; color: #c9a84c; flex-shrink: 0; }

        .action-row { display: flex; gap: 6px; }
        .act-btn {
            flex: 1;
            font-family: 'Cinzel', serif;
            font-size: 0.6em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 8px 4px;
            background: transparent;
            border: 1px solid rgba(201,168,76,0.28);
            color: #c9a84c;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        .act-btn:hover { border-color: #c9a84c; background: rgba(201,168,76,0.08); }
        .act-btn:disabled { opacity: 0.35; cursor: default; }

        .divider { height: 1px; background: rgba(201,168,76,0.1); flex-shrink: 0; }

        .parch-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
        .parch-list::-webkit-scrollbar { width: 3px; }
        .parch-list::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); }

        .parch-row {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 8px;
            border: 1px solid rgba(201,168,76,0.1);
            background: rgba(255,255,255,0.02);
            transition: background 0.15s;
        }
        .parch-row:hover { background: rgba(255,255,255,0.04); }
        .parch-icon { font-size: 0.95em; color: #5a4a38; flex-shrink: 0; width: 18px; text-align: center; }
        .parch-name {
            flex: 1;
            font-family: 'Cinzel', serif; font-size: 0.68em; color: #e8dcc8;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .parch-btn {
            font-family: 'Cinzel', serif; font-size: 0.56em; letter-spacing: 0.08em; text-transform: uppercase;
            color: #c9a84c; border: 1px solid rgba(201,168,76,0.25); background: transparent;
            padding: 3px 7px; cursor: pointer; flex-shrink: 0; transition: all 0.12s;
        }
        .parch-btn:hover { background: rgba(201,168,76,0.08); border-color: #c9a84c; }
        .parch-btn.danger:hover { color: #c06060; border-color: rgba(192,96,96,0.3); }
        .parch-btn:disabled { opacity: 0.35; cursor: default; }

        .empty-note {
            font-family: 'EB Garamond', serif; font-style: italic; font-size: 0.88em;
            color: #4a3e2e; text-align: center; padding: 20px 4px;
        }

        .active-section { flex-shrink: 0; }
        .section-label { font-size: 0.58em; letter-spacing: 0.16em; text-transform: uppercase; color: #5a4e3e; margin-bottom: 6px; }
        .active-count {
            font-family: 'EB Garamond', serif; font-style: italic; font-size: 0.85em; color: #5a4e3e;
        }

        .waiting { font-family: 'EB Garamond', serif; font-style: italic; font-size: 0.88em; color: #4a3e2e; text-align: center; }
    </style>
</head>
<body>
    <h1>Parchments</h1>

    <div class="active-section">
        <div class="section-label">On Table</div>
        <div class="active-count" id="activeCount">— active</div>
    </div>

    <div class="action-row">
        <button class="act-btn" id="btnNewDrawing" disabled>+ Drawing</button>
        <a class="act-btn" id="btnNewEditor" href="#" target="_blank">+ Text / Image</a>
    </div>

    <div class="divider"></div>

    <div class="section-label">Library</div>
    <div class="parch-list" id="parchList"><p class="empty-note">Waiting for table connection…</p></div>

    <p class="waiting" id="waiting">Waiting for table connection…</p>

    <script>
        const bc = new BroadcastChannel('brackenroll-gm-panels');
        let connected = false;
        let parchments = [];
        let activeParchCount = 0;
        let campaignId = null;

        bc.onmessage = e => {
            const d = e.data;
            if (d.type === 'state_update') {
                activeParchCount = d.payload.activeParchCount ?? 0;
                parchments       = d.payload.parchmentList   ?? parchments;
                if (d.payload.campaignId) {
                    campaignId = d.payload.campaignId;
                    document.getElementById('btnNewEditor').href = `parchment-editor.html?campaign=${campaignId}`;
                }
                if (!connected) {
                    connected = true;
                    document.getElementById('waiting').style.display = 'none';
                    document.getElementById('btnNewDrawing').disabled = false;
                }
                render();
            } else if (d.type === 'parch_list_update') {
                parchments = d.payload || [];
                render();
            }
        };

        document.getElementById('btnNewDrawing').addEventListener('click', () => {
            bc.postMessage({ type: 'parch_open_new' });
        });

        function render() {
            document.getElementById('activeCount').textContent =
                activeParchCount ? `${activeParchCount} open on table` : 'None open';

            const list = document.getElementById('parchList');
            if (!parchments.length) {
                list.innerHTML = '<p class="empty-note">No saved parchments yet.</p>';
                return;
            }
            list.innerHTML = '';
            parchments.forEach(p => {
                const type = p.canvas_data?.type || 'drawing';
                const icon = type === 'image' ? '🖼' : type === 'text' ? '📜' : '✍';
                const row  = document.createElement('div');
                row.className = 'parch-row';
                row.innerHTML = `
                    <span class="parch-icon">${icon}</span>
                    <span class="parch-name" title="${esc(p.name)}">${esc(p.name)}</span>
                    <button class="parch-btn" data-action="open" data-id="${p.id}">Open</button>
                    <button class="parch-btn danger" data-action="del" data-id="${p.id}">✕</button>`;
                row.querySelector('[data-action=open]').addEventListener('click', () => {
                    bc.postMessage({ type: 'parch_open_saved', parchmentId: p.id });
                });
                row.querySelector('[data-action=del]').addEventListener('click', () => {
                    if (confirm(`Delete "${p.name}"?`)) bc.postMessage({ type: 'parch_delete', parchmentId: p.id });
                });
                list.appendChild(row);
            });
        }

        function esc(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        bc.postMessage({ type: 'panel_ready' });
    </script>
</body>
</html>
