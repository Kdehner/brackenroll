<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Clocks — Brackenroll GM</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #14110d;
            color: #e8dcc8;
            font-family: 'Cinzel', serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            gap: 14px;
            overflow: hidden;
        }
        h1 {
            font-size: 0.62em;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #c9a84c;
            flex-shrink: 0;
        }
        .clock-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }
        .clock-list::-webkit-scrollbar { width: 3px; }
        .clock-list::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); }
        .clock-item { display: flex; align-items: center; gap: 8px; }
        .clock-pie {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 2px solid rgba(201,168,76,0.25);
            flex-shrink: 0;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .clock-pie:hover { border-color: #c9a84c; }
        .clock-info    { flex: 1; min-width: 0; }
        .clock-name    { font-size: 0.72em; color: #e8dcc8; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .clock-prog    { font-family: 'EB Garamond', serif; font-size: 0.78em; color: #6a5a40; font-style: italic; }
        .clock-btns    { display: flex; gap: 3px; }
        .cbtn {
            background: transparent;
            border: 1px solid rgba(201,168,76,0.2);
            color: #6a5a40;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.62em;
            padding: 3px 6px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: all 0.15s;
        }
        .cbtn:hover         { color: #c9a84c; border-color: #c9a84c; }
        .cbtn.vis-on        { color: #5a9e5a; border-color: rgba(90,158,90,0.4); }
        .cbtn.danger:hover  { color: #c06060; border-color: #c06060; }
        .empty {
            font-family: 'EB Garamond', serif;
            font-style: italic;
            font-size: 0.9em;
            color: #4a3e2e;
            text-align: center;
            padding: 12px 0;
        }
        .new-form {
            border-top: 1px solid rgba(201,168,76,0.14);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }
        .name-input {
            font-family: 'EB Garamond', serif;
            font-size: 0.9em;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(201,168,76,0.22);
            color: #e8dcc8;
            padding: 7px 9px;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }
        .name-input:focus { border-color: #c9a84c; }
        .name-input::placeholder { color: #4a3e2e; }
        .seg-row   { display: flex; gap: 6px; align-items: center; }
        .seg-label { font-size: 0.58em; letter-spacing: 0.1em; text-transform: uppercase; color: #6a5a40; }
        .seg-btn {
            font-family: 'Cinzel', serif; font-size: 0.62em; letter-spacing: 0.08em;
            padding: 5px 10px; background: transparent;
            border: 1px solid rgba(201,168,76,0.22); color: #6a5a40; cursor: pointer; transition: all 0.15s;
        }
        .seg-btn.selected { border-color: #c9a84c; color: #c9a84c; background: rgba(201,168,76,0.1); }
        .add-btn {
            font-family: 'Cinzel', serif; font-size: 0.62em; letter-spacing: 0.12em; text-transform: uppercase;
            padding: 9px; background: transparent;
            border: 1px solid rgba(201,168,76,0.3); color: #c9a84c; cursor: pointer; transition: all 0.2s; width: 100%;
        }
        .add-btn:hover { background: rgba(201,168,76,0.1); border-color: #c9a84c; }
        .waiting { font-family: 'EB Garamond', serif; font-style: italic; font-size: 0.88em; color: #4a3e2e; text-align: center; }
    </style>
</head>
<body>
    <h1>Countdown Clocks</h1>
    <div class="clock-list" id="clockList"></div>
    <div class="new-form">
        <input class="name-input" id="nameInput" placeholder="Clock name…" maxlength="40">
        <div class="seg-row">
            <span class="seg-label">Segments:</span>
            <button class="seg-btn" data-segs="4">4</button>
            <button class="seg-btn selected" data-segs="6">6</button>
            <button class="seg-btn" data-segs="8">8</button>
        </div>
        <button class="add-btn" id="addBtn">+ Add Clock</button>
    </div>
    <p class="waiting" id="waiting">Waiting for table connection…</p>

    <script>
        const bc = new BroadcastChannel('brackenroll-gm-panels');
        let clocks = [], connected = false;
        let selectedSegs = 6;

        bc.onmessage = e => {
            const d = e.data;
            if (d.type !== 'state_update') return;
            clocks = d.payload.clocks || [];
            if (!connected) {
                connected = true;
                document.getElementById('waiting').style.display = 'none';
            }
            renderClocks();
        };

        // Segment picker
        document.querySelectorAll('.seg-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedSegs = parseInt(btn.dataset.segs);
            });
        });

        // Add clock
        document.getElementById('addBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) { document.getElementById('nameInput').focus(); return; }
            bc.postMessage({ type: 'clock_add', name, segments: selectedSegs });
            document.getElementById('nameInput').value = '';
        });

        document.getElementById('nameInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('addBtn').click();
        });

        function escHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderClocks() {
            const listEl = document.getElementById('clockList');
            listEl.innerHTML = '';
            if (!clocks.length) {
                listEl.innerHTML = '<div class="empty">No clocks yet.</div>';
                return;
            }
            clocks.forEach(c => {
                const pct  = Math.round((c.filled / c.segments) * 100);
                const item = document.createElement('div');
                item.className = 'clock-item';
                item.innerHTML = `
                    <div class="clock-pie" data-id="${c.id}"
                        style="background:conic-gradient(#c9a84c ${pct}%,#2a2318 ${pct}%);"
                        title="Click to tick"></div>
                    <div class="clock-info">
                        <div class="clock-name">${escHtml(c.name)}</div>
                        <div class="clock-prog">${c.filled}/${c.segments}</div>
                    </div>
                    <div class="clock-btns">
                        <button class="cbtn${c.visible ? ' vis-on' : ''}" data-id="${c.id}" data-action="toggle">${c.visible ? '👁' : '○'}</button>
                        <button class="cbtn" data-id="${c.id}" data-action="tick">+1</button>
                        <button class="cbtn danger" data-id="${c.id}" data-action="delete">✕</button>
                    </div>`;

                item.querySelector('.clock-pie').addEventListener('click', () => bc.postMessage({ type: 'clock_tick', id: c.id }));
                item.querySelectorAll('[data-action]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const { action, id } = btn.dataset;
                        if (action === 'tick')   bc.postMessage({ type: 'clock_tick',           id });
                        if (action === 'toggle') bc.postMessage({ type: 'clock_toggle_visible', id });
                        if (action === 'delete') bc.postMessage({ type: 'clock_delete',         id });
                    });
                });
                listEl.appendChild(item);
            });
        }

        // Announce ready to receive state from main window
        bc.postMessage({ type: 'panel_ready' });
    </script>
</body>
</html>
